<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Hem</title>
<!-- HEM-v30 -->
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;background:#010208;color:#fff;cursor:none;
  font-family:"SF Pro Display","Samsung Sans","Roboto","Segoe UI",system-ui,sans-serif;user-select:none;}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;background:#010208;}
:root{--ease:cubic-bezier(.32,.72,0,1);}

/* space */
#space{display:none;}
#fx{position:absolute;left:-40px;top:0;width:2000px;height:1080px;pointer-events:none;}
#earth{position:absolute;left:0;top:560px;width:1920px;height:520px;}
#orbit{position:absolute;left:0;top:0;width:1920px;height:1080px;pointer-events:none;}

/* planets */
#halo{position:absolute;left:960px;top:430px;width:0;height:0;will-change:transform,opacity;transition:opacity .35s ease;}
.hx{position:absolute;left:-300px;top:-300px;width:600px;height:600px;border-radius:50%;opacity:0;transition:opacity .7s ease;}
.hx.on{opacity:1;}
#ring{position:absolute;left:-141px;top:-141px;width:282px;height:282px;border-radius:50%;
  border:2.5px solid var(--hc,#4da3ff);box-shadow:0 0 18px var(--hc,#4da3ff),0 0 46px var(--hc,#4da3ff),inset 0 0 22px var(--hc,#4da3ff);
  opacity:.55;transition:border-color .6s ease,box-shadow .6s ease;}
#planets{position:absolute;left:0;top:0;width:1920px;height:1080px;z-index:1;}
.ov,#qp{z-index:20;}#gfx{z-index:21;}#toast,#fps{z-index:30;}#night{z-index:15;}#saver{z-index:25;}
.orb{position:absolute;left:0;top:0;width:230px;height:230px;will-change:transform,opacity;}
.ball{position:absolute;inset:0;border-radius:50%;overflow:hidden;display:grid;place-items:center;
  box-shadow:inset -28px -36px 64px rgba(0,0,0,.62),inset 10px 12px 28px rgba(255,255,255,.2),0 18px 30px rgba(0,0,0,.5);}
.ball img{width:58%;height:58%;border-radius:50%;object-fit:cover;box-shadow:0 6px 18px rgba(0,0,0,.35);}
.ball svg{width:46%;height:46%;color:#fff;filter:drop-shadow(0 4px 10px rgba(0,0,0,.35));}
.ball .wm{font-size:34px;font-weight:800;text-align:center;padding:0 22px;line-height:1.05;text-shadow:0 3px 12px rgba(0,0,0,.4);}
.gl{position:absolute;inset:0;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle at 31% 24%,rgba(255,255,255,.62) 0,rgba(255,255,255,.16) 13%,rgba(255,255,255,0) 32%),
    radial-gradient(circle at 70% 82%,rgba(160,200,255,.18) 0,rgba(160,200,255,0) 38%);
  box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.14);}
#sel{position:absolute;left:460px;width:1000px;top:584px;text-align:center;transition:opacity .22s ease,transform .3s var(--ease);}
#sel.out{opacity:0;transform:translateY(10px);}
#sname{font-size:46px;font-weight:600;letter-spacing:.3px;text-shadow:0 4px 24px rgba(0,0,0,.8);}
#sdesc{font-size:24px;opacity:.62;margin-top:8px;text-shadow:0 3px 16px rgba(0,0,0,.8);}
#dots{position:absolute;left:0;right:0;bottom:34px;display:flex;justify-content:center;gap:12px;}
#dots i{width:9px;height:9px;border-radius:5px;background:rgba(255,255,255,.35);transition:width .35s var(--ease),background .35s;}
#dots i.on{width:28px;background:#fff;}

/* top */
.clock,.topr{text-shadow:0 2px 16px rgba(0,0,0,.6);}
.clock{position:absolute;left:96px;top:66px;}
.clock .t{font-size:92px;font-weight:300;letter-spacing:-1px;line-height:1;}
.clock .d{font-size:30px;opacity:.75;margin-top:12px;}
.topr{position:absolute;right:96px;top:78px;display:flex;align-items:center;gap:30px;color:rgba(255,255,255,.85);}
.topr svg{width:38px;height:38px;}
.wx{font-size:28px;font-weight:500;}
#wifi.off{opacity:.35;}

/* cards (Alla appar) */
.rc{width:262px;height:164px;border-radius:22px;overflow:hidden;position:relative;display:grid;place-items:center;
  background:#24262b;border:1.5px solid rgba(255,255,255,.08);transition:transform .4s var(--ease),box-shadow .3s;}
.recent .rc:first-child{width:400px;height:225px;}
.rc img.ban{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.rc img.ico{width:84px;height:84px;border-radius:20px;}
.rc .nm{position:absolute;left:0;right:0;bottom:0;padding:12px 16px;font-size:21px;font-weight:500;
  background:linear-gradient(transparent,rgba(0,0,0,.75));white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rc .wm{font-size:34px;font-weight:800;text-align:center;padding:0 12px;}
.rc .num{position:absolute;left:12px;top:10px;width:40px;height:40px;border-radius:12px;background:rgba(0,0,0,.6);
  display:grid;place-items:center;font-size:22px;font-weight:700;}
.rc.focus{transform:scale(1.06);box-shadow:0 22px 44px rgba(0,0,0,.5);z-index:2;}
.gw .rc.focus{box-shadow:0 0 0 3px #fff,0 22px 44px rgba(0,0,0,.5);}
.rc.media .mshade{position:absolute;inset:0;background:linear-gradient(transparent 40%,rgba(0,0,0,.82));}
.rc.media .mt{position:absolute;left:14px;right:14px;bottom:12px;display:flex;align-items:center;gap:10px;font-size:21px;font-weight:600;}
.rc.media .mt span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rc.media .mi{width:30px;height:30px;border-radius:8px;flex:0 0 auto;}
.rc.media .mplay{position:absolute;left:50%;top:42%;width:62px;height:62px;margin:-31px 0 0 -31px;border-radius:50%;background:rgba(0,0,0,.45);border:2px solid rgba(255,255,255,.8);}
.rc.media .mplay::after{content:"";position:absolute;left:24px;top:18px;border-left:20px solid #fff;border-top:13px solid transparent;border-bottom:13px solid transparent;}
.empty{font-size:25px;opacity:.5;align-self:center;}
/* overlays */
.ov{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .3s ease,visibility 0s linear .3s;}
.ov.open{opacity:1;visibility:visible;transition:opacity .3s ease;}
#grid{background:rgba(3,5,14,.96);padding:80px 110px;}
#grid h2,#places h2{font-size:44px;font-weight:600;}
.hint{font-size:23px;opacity:.55;margin:10px 0 36px;}
#grid .gw .rc{opacity:0;transform:scale(.45) rotate(-5deg);transition:opacity .35s ease,transform .7s cubic-bezier(.34,1.56,.64,1),box-shadow .3s;}
#grid .gw .rc.gone{opacity:0;transform:scale(.3) translateY(40px);transition:opacity .3s ease,transform .45s cubic-bezier(.5,0,.75,0);}
#grid h2,#grid .hint{transform:translateY(-24px);opacity:0;transition:opacity .45s ease .1s,transform .6s var(--ease) .1s;}
#grid.open h2{transform:none;opacity:1;}#grid.open .hint{transform:none;opacity:.55;}
#grid .gw .rc.lit{opacity:1;transform:none;}
#grid .gw .rc.lit.focus{transform:scale(1.06);}
#gfx{position:absolute;left:0;top:0;width:1920px;height:1080px;pointer-events:none;}
.lhead{display:flex;align-items:center;gap:60px;margin-bottom:46px;}
#live{background:#03050d;padding:80px 110px;}
#live h2{font-size:44px;font-weight:600;}
.ltabs{display:flex;gap:16px;}
.ltab{font-size:28px;font-weight:600;padding:14px 34px;border-radius:40px;background:rgba(255,255,255,.07);opacity:.75;transition:background .25s,transform .35s var(--ease),opacity .25s;}
.ltab.sel{opacity:1;background:rgba(255,255,255,.16);}
.ltab.focus{background:#fff;color:#111;opacity:1;transform:scale(1.06);}
.lvp{height:760px;overflow:hidden;padding:14px;margin:-14px;}
.lgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:34px 30px;transition:transform .45s var(--ease);}
.lc{height:200px;border-radius:24px;position:relative;overflow:hidden;padding:26px 28px;display:flex;flex-direction:column;justify-content:flex-end;
  border:1.5px solid rgba(255,255,255,.08);transition:transform .4s var(--ease),box-shadow .3s;}
.lc .ln{font-size:40px;font-weight:800;letter-spacing:-.5px;line-height:1;}
.lc .ls{font-size:21px;opacity:.8;margin-top:10px;}
.lc .lv{position:absolute;left:24px;top:22px;font-size:17px;font-weight:700;letter-spacing:1.5px;padding:5px 12px;border-radius:8px;background:rgba(0,0,0,.35);}
.lc .lv::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;background:#ff4d4d;margin-right:8px;vertical-align:1px;}
.lc .lapp{position:absolute;right:24px;top:22px;font-size:17px;opacity:.75;}
.lc.focus{transform:scale(1.06);box-shadow:0 0 0 3px #fff,0 24px 50px rgba(0,0,0,.55);z-index:2;}
.lhint{position:absolute;left:110px;bottom:46px;font-size:22px;opacity:.5;}
.gvp{height:800px;overflow:hidden;padding:14px;margin:-14px;}
.gw{display:grid;grid-template-columns:repeat(6,1fr);gap:38px 30px;transition:transform .45s var(--ease);}
.gw .rc{width:auto;height:auto;aspect-ratio:16/10;}
#places{background:rgba(3,5,14,.96);padding:80px 110px;}
.pl{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;margin-top:36px;}
.pl div{font-size:27px;padding:20px 24px;border-radius:18px;background:rgba(255,255,255,.07);transition:transform .3s var(--ease),background .2s;}
.pl div.focus{background:#fff;color:#111;transform:scale(1.05);}

/* quick panel */
#qp{position:absolute;top:0;right:0;bottom:0;width:600px;background:rgba(10,13,28,.97);border-left:1.5px solid rgba(255,255,255,.1);
  padding:70px 44px;transform:translate3d(105%,0,0);transition:transform .5s var(--ease);
  box-shadow:-40px 0 80px rgba(0,0,0,.5);}
#qp.open{transform:none;}
#qp h2{font-size:40px;font-weight:600;margin-bottom:30px;}
.qvp{height:860px;overflow:hidden;margin:0 -10px;padding:0 10px;}
#qlist{transition:transform .45s var(--ease);}
.qi{display:flex;align-items:center;gap:22px;padding:18px 22px;border-radius:22px;margin-bottom:10px;transition:background .2s,transform .3s var(--ease);}
.qi .qic{width:62px;height:62px;border-radius:18px;background:rgba(255,255,255,.08);display:grid;place-items:center;flex:0 0 auto;}
.qi .qic svg{width:32px;height:32px;}
.qi b{display:block;font-size:28px;font-weight:600;}
.qi small{display:block;font-size:21px;opacity:.6;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:400px;}
.qi.focus{background:#fff;color:#111;transform:scale(1.03);}
.qi.focus .qic{background:rgba(0,0,0,.08);}
.ver{position:absolute;left:44px;bottom:34px;font-size:19px;opacity:.35;}

#toast{position:absolute;left:50%;bottom:70px;transform:translate3d(-50%,30px,0);background:#fff;color:#111;font-size:27px;font-weight:500;
  padding:22px 38px;border-radius:40px;opacity:0;transition:opacity .3s,transform .4s var(--ease);max-width:1300px;text-align:center;}
#toast.on{opacity:1;transform:translate3d(-50%,0,0);}
#fps{position:absolute;left:20px;top:20px;font:600 24px monospace;background:rgba(0,0,0,.7);padding:8px 14px;border-radius:10px;display:none;}
#night{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity 2s;}
#saver{background:#000;}
#saver .sp{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity 2s;}
#saver .sp.on{opacity:1;}
#saver .sc{position:absolute;right:90px;bottom:80px;text-align:right;text-shadow:0 4px 30px rgba(0,0,0,.6);}
#saver .sc .t{font-size:150px;font-weight:200;line-height:1;}
#saver .sc .d{font-size:34px;opacity:.9;margin-top:10px;}
</style>
</head>
<body>
<div id="stage">
  <canvas id="space" width="1250" height="675"></canvas>
  <canvas id="fx" width="1000" height="540"></canvas>
  <canvas id="earth" width="1344" height="364"></canvas>
  <svg id="orbit" viewBox="0 0 1920 1080">
    <defs><linearGradient id="og" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#9cc4ff" stop-opacity="0"/><stop offset=".22" stop-color="#9cc4ff" stop-opacity=".28"/>
      <stop offset=".5" stop-color="#cfe2ff" stop-opacity=".42"/><stop offset=".78" stop-color="#9cc4ff" stop-opacity=".28"/>
      <stop offset="1" stop-color="#9cc4ff" stop-opacity="0"/></linearGradient></defs>
    <filter id="ob" x="-5%" y="-5%" width="110%" height="110%"><feGaussianBlur stdDeviation="3"/></filter>
    <ellipse cx="960" cy="1080" rx="1000" ry="650" fill="none" stroke="url(#og)" stroke-width="7" opacity=".35" filter="url(#ob)"/>
    <ellipse cx="960" cy="1080" rx="1000" ry="650" fill="none" stroke="url(#og)" stroke-width="1.2" opacity=".45"/>
  </svg>
  <div id="halo"><div class="hx" id="hA"></div><div class="hx" id="hB"></div><div id="ring"></div></div>
  <div id="planets"></div>
  <div id="sel"><div id="sname"></div><div id="sdesc"></div></div>
  <div id="dots"></div>
  <div class="clock"><div class="t" id="ct">--:--</div><div class="d" id="cd"></div></div>
  <div class="topr">
    <div class="wx" id="wx"></div>
    <svg id="wifi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 8.5a15 15 0 0 1 20 0M5 12a10 10 0 0 1 14 0M8.5 15.5a5 5 0 0 1 7 0"/><circle cx="12" cy="19" r="1.4" fill="currentColor"/></svg>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
  </div>

  <div id="night"></div>

  <div id="grid" class="ov"><h2>Alla appar</h2><div class="hint">Håll in OK eller tryck ▶❚❚ för att fästa en app i omloppsbanan runt jorden.</div><div class="gvp"><div class="gw" id="gw"></div></div></div>
  <canvas id="gfx" width="960" height="540"></canvas>
  <div id="live" class="ov"><div class="lhead"><h2>Live-tv</h2><div class="ltabs" id="ltabs"></div></div>
    <div class="lvp"><div class="lgrid" id="lgrid"></div></div><div class="lhint" id="lhint"></div></div>
  <div id="places" class="ov"><h2>Välj ort för vädret</h2><div class="pl" id="pl"></div></div>

  <div id="qp">
    <h2>Snabbpanel</h2>
    <div class="qvp"><div id="qlist"></div></div>
    <div class="ver" id="ver"></div>
  </div>

  <div id="saver" class="ov"><div class="sc"><div class="t" id="st"></div><div class="d" id="sd"></div></div></div>
  <div id="toast"></div>
  <div id="fps"></div>
</div>

<script>
"use strict";
const VERSION="30.4";
let saverOn=false,sT=0,iT=0,sCur=null;
const B=window.OceanBridge;
const $=id=>document.getElementById(id);
const NEWAPP=!!(window.OceanBridge&&window.OceanBridge.memory);
const call=(fn,...a)=>{try{if(B&&B[fn])return B[fn](...a);}catch(e){}return null;};
const LS={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v);}catch(e){return d;}},
          set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};

/* ===== apps ===== */
const MOCK=[["Telia Play","se.telia.androidtv.launcher"],["YouTube","com.google.android.youtube.tv"],["SmartTube","org.smarttube.stable"],
 ["Stremio","com.stremio.one"],["SVT Play","se.svt.android.svtplay"],["TV4 Play","se.tv4.tv4playtab"],["Spotify","com.spotify.tv.android"],
 ["Max","com.wbd.stream"],["VLC","org.videolan.vlc"],["TV Bro","com.phlox.tvwebbrowser"],["Google Play Butik","com.android.vending"]]
 .map(([label,pkg])=>({label,pkg}));
const COL={"YouTube":"#ff0033","SmartTube":"#c62828","Stremio":"#5b3fd1","SVT Play":"#1e8c45","TV4 Play":"#e3002b","Spotify":"#1db954",
 "Max":"#002be7","VLC":"#ff8800","TV Bro":"#1a73e8","BrowseHere":"#1565c0","Telia Play":"#6a2bd9","Google Play Butik":"#2d3138"};
let APPS=[];try{const r=call("getApps");if(r)APPS=JSON.parse(r);}catch(e){}
if(!APPS.length)APPS=MOCK;
APPS=APPS.filter(a=>a.pkg!=="se.telia.androidtv.launcher");
const byPkg=p=>APPS.find(a=>a.pkg===p);
const find=re=>APPS.find(a=>re.test(a.label)||re.test(a.pkg));

/* recent + favourites */
const getRecent=()=>LS.get("recent",[]);
const getFav=()=>LS.get("fav",[]);
function remember(pkg){let r=getRecent().filter(x=>x.pkg!==pkg);r.unshift({pkg,t:Date.now()});LS.set("recent",r.slice(0,8));}
let leftForApp=false;
function launch(pkg,label){if(!pkg){toast((label||"Appen")+" finns inte på boxen");return;}remember(pkg);leftForApp=true;
  if(call("launch",pkg)===null&&!B)console.log("öppna",pkg);}
function ago(t){const m=Math.round((Date.now()-t)/6e4);if(m<1)return "nyss";if(m<60)return m+" min sedan";
  const h=Math.round(m/60);if(h<24)return h+" tim sedan";const d=Math.round(h/24);return d===1?"igår":d+" dagar sedan";}

function card(a,num){const c=document.createElement("div");c.className="rc f";c.dataset.pkg=a.pkg;
  if(a.banner)c.innerHTML=`<img class="ban" src="data:image/png;base64,${a.banner}">`;
  else if(a.icon){c.style.background="#f2f2f4";c.innerHTML=`<img class="ico" src="data:image/png;base64,${a.icon}"><div class="nm">${a.label}</div>`;}
  else{c.style.background=COL[a.label]||"#2a2c31";c.innerHTML=`<span class="wm">${a.label}</span>`;}
  if(num)c.insertAdjacentHTML("beforeend",`<div class="num">${num}</div>`);
  return c;}


/* ===== actions ===== */
const TELIA_LAUNCHER="se.telia.androidtv.launcher";
function browser(){return find(/browse ?here/i)||find(/tvwebbrowser|tv bro/i);}
function teliaPkg(){const s=APPS.find(a=>/telia/i.test(a.label+a.pkg)&&a.pkg!==TELIA_LAUNCHER&&!/teletext/i.test(a.pkg));return s?s.pkg:TELIA_LAUNCHER;}
function act(a,el){
  switch(a){
    case "apps":return openGrid();
    case "panel":return openPanel();
    case "resume":return launch(el.dataset.pkg);
    case "tv":return openLive();
    case "telia":case "content":{
      const section={tv:"Tv",content:"Mitt innehåll"}[a];
      if(B&&B.openTelia&&section){remember(TELIA_LAUNCHER);leftForApp=true;B.openTelia(section);return;}
      const p=teliaPkg();
      if(p===TELIA_LAUNCHER&&B&&!B.openUri){toast("Tryck HOME på fjärren för att komma till Telia");return;}
      if(section)toast("Välj "+section+" i Telias meny");return launch(p,"Telia");}
    case "youtube":{const y=byPkg("com.google.android.youtube.tv")||APPS.find(a=>/youtube/i.test(a.label)&&!/music|kids|smarttube/i.test(a.label+a.pkg));return launch(y&&y.pkg,"YouTube");}
    case "music":{const s=find(/spotify/i);return launch(s&&s.pkg,"Spotify");}
    case "store":return launch("com.android.vending","Play Butik");
    case "web":{const w=browser();return launch(w&&w.pkg,"BrowseHere");}
    case "account":{if(B&&B.openTelia){remember(TELIA_LAUNCHER);leftForApp=true;B.openTelia("Mitt konto");return;}const w=browser();if(B&&!B.openUri){toast("Gå till telia.se/mitt-telia i webbläsaren");return launch(w&&w.pkg,"BrowseHere");}if(w)remember(w.pkg);call("openUri","https://www.telia.se/mitt-telia",w?w.pkg:"");return;}
  }
}


/* ===== focus ===== */
let zone="main",gi=0,qi=0,pi=0;
function render(){noScroll();document.querySelectorAll(".focus").forEach(e=>e.classList.remove("focus"));
  if(zone==="grid"){const g=document.querySelectorAll("#gw .rc");if(g[gi]){g[gi].classList.add("focus");}return;}
  if(zone==="panel"){const q=document.querySelectorAll(".qi");if(q[qi]){q[qi].classList.add("focus");
    const it=q[qi],vh=860,top=it.offsetTop,bot=top+it.offsetHeight,max=Math.max(0,$("qlist").scrollHeight-vh);
    let off=Math.min(max,Math.max(0,bot-vh+40));if(top<off)off=Math.max(0,top-20);$("qlist").style.transform=`translateY(${-off}px)`;}return;}
  if(zone==="places"){const p=document.querySelectorAll("#pl div");if(p[pi]){p[pi].classList.add("focus");}return;}
  if(zone==="live"){const el=lr===0?document.querySelectorAll("#ltabs .ltab")[lt]:document.querySelectorAll("#lgrid .lc")[li];if(el)el.classList.add("focus");return;}}

function key(k){
  bumpIdle();

  if(k==="guide"){if(zone==="live")return closeLive();toMain();return openLive();}
  if(k==="chup"||k==="chdown"){if(zone==="live")return liveKey(k==="chup"?"up":"down");toMain();return openLive();}
  if(k==="menu"||k==="rec"){if(zone==="panel")return closePanel();if(zone==="places")return placeKey("back");toMain();return openPanel();}
  if(k==="allapps"){if(zone==="grid")return closeGrid();toMain();return openGrid();}
  if(k==="last"){const r=getRecent().map(x=>x.pkg).filter(byPkg);if(r[1])return launch(r[1]);if(r[0])return launch(r[0]);return toast("Ingen tidigare app än");}
  if(k==="playkey"){if(zone==="grid")return toggleFav(sortedApps()[gi].pkg);if(zone==="main"){const r=getRecent().find(x=>byPkg(x.pkg));
      if(r)return launch(r.pkg);return toast("Ingen app att fortsätta med än");}return;}
  if(/^n\d$/.test(k))return numKey(+k[1]);
  if(zone==="grid")return gridKey(k);
  if(zone==="live")return liveKey(k);
  if(zone==="panel")return panelKey(k);
  if(zone==="places")return placeKey(k);
  mainKey(k);}

function mix(a,b,k){const p=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));const x=p(a),y=p(b);

    g.drawImage(img,0,0,16,16);const d=g.getImageData(0,0,16,16).data;let r=0,gg=0,b=0,n=0;
    for(let i=0;i<d.length;i+=4){const mx=Math.max(d[i],d[i+1],d[i+2]),mn=Math.min(d[i],d[i+1],d[i+2]);if(d[i+3]<200||mx-mn<40)continue;r+=d[i];gg+=d[i+1];b+=d[i+2];n++;}
    if(!n)return;const col="#"+[r,gg,b].map(v=>Math.round(v/n).toString(16).padStart(2,"0")).join("");o.col=col;
    o.el.querySelector(".ball").style.background=`radial-gradient(circle at 34% 28%,${mix(col,"#ffffff",.38)} 0%,${col} 42%,${mix(col,"#000000",.72)} 100%)`;

/* orbit geometry: ellipse centred below the screen, the selected planet sits at the top */
const OX=960,OY=1080,OA=1000,OB=650,STEP=.36;
let pulse={};
function layout(force){
  const now=performance.now();
  ORB.forEach((o,i)=>{const th=(i-op)*STEP,a=Math.abs(th);
    if(a>1.5){if(o.vis!==false||force){o.el.style.opacity=0;o.vis=false;}return;}
    o.vis=true;
    const x=OX+OA*Math.sin(th),y=OY-OB*Math.cos(th);
    let s=(.6+.4*Math.cos(th*1.15))*(1+.16*Math.max(0,1-a/STEP));
    const pu=pulse[o.key];if(pu){const k=(now-pu)/360;if(k<1)s*=1+.09*Math.sin(k*Math.PI);else delete pulse[o.key];}
    const al=a<.85?1:Math.max(0,1-(a-.85)/.5);
    o.el.style.transform=`translate3d(${(x-115).toFixed(1)}px,${(y-115).toFixed(1)}px,0) scale(${s.toFixed(4)})`;
    o.el.style.opacity=al.toFixed(3);const z=Math.round(100-a*40);if(o.z!==z){o.z=z;o.el.style.zIndex=z;}});

/* ===== Earth: WebGL sphere with day map, city lights, drifting clouds and an atmosphere ===== */
const EARTH="https://raw.githubusercontent.com/cruzin4bruzinrl-code/enkelhem/main/tv/earth/";
const EC=$("earth");let gl=null,eU={},eTex=0,eFrames=0,eQ=0;
const VS="attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}";
const FS=`precision highp float;
uniform vec2 uRes;uniform float uRot,uCld,uTex;uniform sampler2D uDay,uAux;
const float R=1000.;const vec2 C=vec2(960.,1700.);
void main(){
 vec2 sp=vec2(gl_FragCoord.x/uRes.x*1920.,560.+(1.-gl_FragCoord.y/uRes.y)*520.);
 vec2 p=(sp-C)/R;p.y=-p.y;float r2=dot(p,p);
 vec3 L=normalize(vec3(-.6,.62,.5));
 float lit=clamp(dot(normalize(vec3(p,.25)),L)*.7+.45,.12,1.);
 if(r2>1.){float d=(sqrt(r2)-1.)*R;
   float a=(exp(-d/22.)*.75+exp(-d/70.)*.28)*lit*smoothstep(560.,700.,sp.y);gl_FragColor=vec4(vec3(.36,.62,1.)*a,a);return;}
 float z=sqrt(1.-r2);vec3 n=vec3(p,z);
 float cr=cos(.38),sr=sin(.38);vec3 q=vec3(n.x*cr-n.y*sr,n.x*sr+n.y*cr,n.z);
 float ct=cos(.12),st=sin(.12);vec3 b=vec3(q.x,q.y*ct+q.z*st,-q.y*st+q.z*ct);
 float lon=atan(b.x,b.z),lat=asin(clamp(b.y,-1.,1.));
 float v=.5-lat/3.14159265;float u=fract(lon/6.2831853+uRot);
 float dif=dot(n,L),day=clamp(dif,0.,1.);
 vec3 base=vec3(.03,.14,.36);float lights=0.,cl=0.;
 if(uTex>.5){base=texture2D(uDay,vec2(u,v)).rgb;lights=texture2D(uAux,vec2(u,v)).r;cl=texture2D(uAux,vec2(fract(u+uCld),v)).g;}
 cl=clamp(cl*1.5,0.,1.);
 vec3 col=base*(.05+1.25*day);
 float ocean=clamp((base.b-max(base.r,base.g)*1.05)*6.,0.,1.);
 col+=vec3(1.,.95,.85)*pow(max(dot(reflect(-L,n),vec3(0.,0.,1.)),0.),36.)*.38*ocean*(1.-cl);
 col=mix(col,vec3(1.)*(.05+1.05*day),cl*.88);
 col+=vec3(1.,.74,.38)*lights*lights*2.2*(1.-smoothstep(-.18,.08,dif))*(1.-cl*.8);
 float fr=pow(1.-z,2.3);col=mix(col,vec3(.36,.62,1.)*(.25+.95*clamp(dif+.35,0.,1.)),fr*.8);
 float edge=clamp((1.-sqrt(r2))*R/1.6,0.,1.);float ga=1.05*lit;
 gl_FragColor=vec4(col*edge+vec3(.36,.62,1.)*ga*(1.-edge),edge+ga*(1.-edge));}`;
function earthSize(){eQ=LS.get("perf",false)?.5:.7;const w=Math.round(1920*eQ),h=Math.round(520*eQ);
  if(EC.width!==w){EC.width=w;EC.height=h;}if(gl){gl.viewport(0,0,w,h);gl.uniform2f(eU.res,w,h);}}
function initEarth(){
  try{gl=EC.getContext("webgl",{alpha:true,premultipliedAlpha:true,antialias:false,depth:false,stencil:false,powerPreference:"low-power"});}catch(e){gl=null;}
  if(!gl){earth2D();return;}
  const sh=(t,s)=>{const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))console.log("jordfel "+gl.getShaderInfoLog(o));return o;};
  const pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,VS));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,FS));gl.linkProgram(pr);
  if(!gl.getProgramParameter(pr,gl.LINK_STATUS)){console.log("jordfel länk");gl=null;earth2D();return;}
  gl.useProgram(pr);const bf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,bf);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
  const loc=gl.getAttribLocation(pr,"p");gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
  ["res","rot","cld","tex","day","aux"].forEach(k=>eU[k]=gl.getUniformLocation(pr,"u"+k[0].toUpperCase()+k.slice(1)));
  gl.uniform1i(eU.day,0);gl.uniform1i(eU.aux,1);gl.uniform1f(eU.tex,0);gl.clearColor(0,0,0,0);
  earthSize();
  let n=0;const tx=[gl.createTexture(),gl.createTexture()];
  ["day.jpg","aux.jpg"].forEach((f,i)=>{const im=new Image();im.crossOrigin="anonymous";
    im.onload=()=>{gl.activeTexture(gl.TEXTURE0+i);gl.bindTexture(gl.TEXTURE_2D,tx[i]);
      gl.texImage2D(gl.TEXTURE_2D,0,gl.RGB,gl.RGB,gl.UNSIGNED_BYTE,im);
      gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.REPEAT);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
      if(++n===2){eTex=1;gl.uniform1f(eU.tex,1);}};
    im.onerror=()=>console.log("jordtextur saknas "+f);im.src=EARTH+f;});}
function drawEarth(t){if(!gl)return;const s=t/1000;
  gl.uniform1f(eU.rot,(s/260)%1);gl.uniform1f(eU.cld,(s/2200)%1);gl.clear(gl.COLOR_BUFFER_BIT);gl.drawArrays(gl.TRIANGLES,0,3);eFrames++;}
function earth2D(){const c=EC.getContext("2d");if(!c)return;const w=EC.width,h=EC.height,k=w/1920;
  const cx=960*k,cy=(1700-560)*k,r=1000*k;
  const at=c.createRadialGradient(cx,cy,r*.98,cx,cy,r*1.08);at.addColorStop(0,"rgba(90,160,255,.7)");at.addColorStop(1,"rgba(90,160,255,0)");
  c.fillStyle=at;c.beginPath();c.arc(cx,cy,r*1.08,0,7);c.fill();
  const sg=c.createRadialGradient(cx-r*.45,cy-r*.75,r*.1,cx,cy,r);sg.addColorStop(0,"#3f86d8");sg.addColorStop(.6,"#0d3a7a");sg.addColorStop(1,"#020a1e");
  c.fillStyle=sg;c.beginPath();c.arc(cx,cy,r,0,7);c.fill();}

/* ===== space: stars and nebulae painted once, slow dust drifting on top ===== */
function paintSpace(){const c=$("space").getContext("2d"),W=1250,H=675;c.fillStyle="#010208";c.fillRect(0,0,W,H);
  const neb=(x,y,r,col,a)=>{const g=c.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,`rgba(${col},${a})`);g.addColorStop(1,`rgba(${col},0)`);c.fillStyle=g;c.fillRect(0,0,W,H);};
  neb(1000,110,420,"70,60,170",.22);neb(1120,330,300,"30,90,170",.16);neb(170,190,380,"90,40,130",.14);neb(620,40,260,"40,70,150",.1);neb(620,560,520,"20,60,140",.18);
  let sd=7;const rnd=()=>{sd=(sd*16807)%2147483647;return sd/2147483647;};
  for(let i=0;i<520;i++){const x=rnd()*W,y=rnd()*H*.86,m=rnd(),r=m>.985?1.5:m>.9?.95:.55,a=.25+rnd()*.7,blue=rnd()<.3;
    c.fillStyle=blue?`rgba(190,215,255,${a})`:`rgba(255,250,240,${a})`;c.beginPath();c.arc(x,y,r,0,7);c.fill();
    if(m>.985){const g=c.createRadialGradient(x,y,0,x,y,7);g.addColorStop(0,"rgba(200,220,255,.35)");g.addColorStop(1,"rgba(200,220,255,0)");c.fillStyle=g;c.fillRect(x-7,y-7,14,14);}}
  try{const st=$("stage");st.style.background=`#010208 url(${$("space").toDataURL("image/jpeg",.92)}) -40px 0/2000px 1080px no-repeat`;}catch(e){$("space").style.display="block";}}
const fx=$("fx"),g=fx.getContext("2d");
function sprite(rgb){const s=document.createElement("canvas");s.width=s.height=32;const c=s.getContext("2d");
  const gr=c.createRadialGradient(16,16,0,16,16,16);gr.addColorStop(0,`rgba(${rgb},1)`);gr.addColorStop(.35,`rgba(${rgb},.35)`);gr.addColorStop(1,`rgba(${rgb},0)`);
  c.fillStyle=gr;c.fillRect(0,0,32,32);return s;}
const SPR=[sprite("255,255,255"),sprite("170,200,255"),sprite("200,170,255")];
const P=[];for(let i=0;i<34;i++)P.push(newP(true));
function newP(any){return{x:any?Math.random()*1000:-10,y:Math.random()*420,s:2+Math.random()*6,v:.05+Math.random()*.16,
  w:Math.random()*6.28,ws:.003+Math.random()*.008,a:.12+Math.random()*.35,k:SPR[Math.floor(Math.random()*3)]};}
let fxOn=true;
function drawDust(){g.clearRect(0,0,1000,540);
  for(const p of P){p.x+=p.v;p.w+=p.ws;if(p.x>1010)Object.assign(p,newP(false));
    g.globalAlpha=p.a*(0.55+0.45*Math.sin(p.w*2));g.drawImage(p.k,p.x-p.s/2,p.y+Math.sin(p.w)*8-p.s/2,p.s,p.s);}
  g.globalAlpha=1;}
function applyPerf(){const on=LS.get("perf",false);fxOn=!on;document.body.classList.toggle("perf",on);if(on)g.clearRect(0,0,1000,540);earthSize();}

/* ===== one animation loop for everything on the home screen ===== */
let fLast=0,fN=0,hLast=0;
let eClock=0;
function frame(t){requestAnimationFrame(frame);
  const dt=Math.min((t-(fLast||t))/1000,1/20);fLast=t;
  if(document.hidden||saverOn||zone==="grid"||zone==="live"||zone==="places")return;
  fN++;
  const d=sel-op;const moving=Math.abs(d)>.003||Math.abs(ov)>.03;
  if(moving){ov+=(170*d-26*ov)*dt;op+=ov*dt;}else if(op!==sel){op=sel;ov=0;layout(false);}
  if(moving||Object.keys(pulse).length)layout(false);
  /* the Earth always turns; while the planets glide it is drawn less often (it turns so slowly that the eye can't tell) */
  eClock+=dt;
  if(moving){if(fN%4===0)drawEarth(eClock*1000);return;}
  if(t-hLast>40){hLast=t;const br=.5+.5*Math.sin(t/1000*Math.PI*2/3.2);
    const h=$("halo");h.style.transform=`scale(${(.97+.05*br).toFixed(4)})`;h.style.opacity=(.55+.45*br).toFixed(3);}
  if(fN%2===0)drawEarth(eClock*1000);
  else if(fxOn&&fN%4===1)drawDust();}

/* ===== favourites + number keys ===== */
function toggleFav(pkg){let f=getFav();const a=byPkg(pkg);
  if(f.includes(pkg)){toast((a?a.label:"Appen")+" lossad");f=f.map(x=>x===pkg?"":x);}
  else{const free=f.indexOf("");const slot=free>=0?free:f.length;if(slot>=9){toast("Max 9 fästa appar");return;}f[slot]=pkg;toast((a?a.label:"Appen")+" fäst på "+(slot+1));}
  LS.set("fav",f);buildOrbit();if(zone==="grid"){const keep=gi;fillGrid();gi=keep;render();}}

function parseKanaler(t){const tabs=[];
  t.split("\n").forEach(l=>{l=l.trim();if(!l||l[0]==="#")return;const[k,n,u,tab,s,c]=l.split("|");if(!n||!tab)return;

    T.ch.push({k,n,s:s||"",c:c||"#2a2c31",u:k==="yt"?YT(u):u,tg:k==="telia"?u:null});});
  return tabs.length?tabs:null;}

function stagePos(el){let x=0,y=0,e=el;while(e&&e.id!=="stage"){x+=e.offsetLeft;y+=e.offsetTop;e=e.offsetParent;}return{x,y,w:el.offsetWidth,h:el.offsetHeight};}
function appsTile(){const i=ORB.findIndex(o=>o.key==="apps"),th=(i-op)*STEP;if(i<0||Math.abs(th)>1.2)return{x:960,y:430};return{x:OX+OA*Math.sin(th),y:OY-OB*Math.cos(th)};}

/* ===== particles: burst out of the Appar tile into the grid, and get sucked back in ===== */
const gfx=$("gfx"),gg=gfx.getContext("2d");let GP=[],gAnim=false;
function gfxRun(){if(gAnim)return;gAnim=true;requestAnimationFrame(gStep);}
function bez(p,k){const q=k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2,iq=1-q;return[iq*iq*p.sx+2*iq*q*p.cx+q*q*p.tx,iq*iq*p.sy+2*iq*q*p.cy+q*q*p.ty];}
function gStep(t){gg.clearRect(0,0,960,540);let alive=false;
  for(const p of GP){const e=t-p.t0;if(e<0){alive=true;continue;}let a,s=p.s,x,y;
    if(p.kind==="out"){const k=e/p.d;if(k>=1)continue;x=p.sx+p.vx*k;y=p.sy+p.vy*k-30*k*k;a=p.a*(1-k);}
    else{const k=Math.min(1,e/p.d);[x,y]=bez(p,k);
      if(k>=1){if(!p.done){p.done=1;if(p.card)p.card.classList.add("lit");else if(p.onEnd)p.onEnd();}
        const f=(e-p.d)/300;if(f>=1)continue;a=p.a*(1-f);s=p.s*(1+f*1.6);}
      else{a=p.a*Math.min(1,k*3);if(k>.05){const g=bez(p,k-.06);gg.globalAlpha=a*.35;gg.drawImage(p.k,g[0]/2-s*.35,g[1]/2-s*.35,s*.7,s*.7);}}}
    alive=true;gg.globalAlpha=a;gg.drawImage(p.k,x/2-s/2,y/2-s/2,s,s);}
  gg.globalAlpha=1;if(alive)requestAnimationFrame(gStep);else{gAnim=false;GP=[];gg.clearRect(0,0,960,540);}}
function gridIn(){const cards=[...document.querySelectorAll("#gw .rc")];if(!cards.length)return;const now=performance.now();
  cards.forEach(c=>c.classList.remove("gone"));
  if(LS.get("perf",false)){cards.forEach((c,i)=>{c.style.transitionDelay=Math.min(i,24)*25+"ms";c.classList.add("lit");});return;}
  const o=appsTile(),R=cards.map(c=>stagePos(c)),vis=R.map(r=>r.y<1040);
  GP=GP.filter(p=>p.kind==="out");
  cards.forEach((c,i)=>{c.style.transitionDelay="0ms";if(!vis[i]){setTimeout(()=>c.classList.add("lit"),900);return;}
    const r=R[i],delay=Math.hypot(r.x+r.w/2-o.x,r.y+r.h/2-o.y)*0.18;
    for(let j=0;j<7;j++){const tx=r.x+Math.random()*r.w,ty=r.y+Math.random()*r.h,ang=Math.random()*6.283,fl=180+Math.random()*320;
      GP.push({kind:"in",card:c,t0:now+delay+Math.random()*120,d:520+Math.random()*220,sx:o.x,sy:o.y,tx,ty,
        cx:o.x+Math.cos(ang)*fl,cy:o.y+Math.sin(ang)*fl,s:9+Math.random()*13,a:.6+Math.random()*.35,k:SPR[j%3]});}});
  gfxRun();setTimeout(()=>cards.forEach(c=>c.classList.add("lit")),2400);}
function gridOut(){const now=performance.now(),o=appsTile(),cards=[...document.querySelectorAll("#gw .rc.lit")],perf=LS.get("perf",false);let maxD=0;
  GP=GP.filter(p=>!p.card);
  cards.forEach(c=>{const r=stagePos(c);r.y+=gOff;const vis=!(r.y>1040||r.y+r.h<0);
    const delay=Math.hypot(r.x+r.w/2-o.x,r.y+r.h/2-o.y)*0.14;maxD=Math.max(maxD,delay);
    c.style.transitionDelay=Math.round(delay)+"ms";c.classList.remove("lit");c.classList.add("gone");
    if(perf||!vis)return;
    for(let j=0;j<5;j++){const sx=r.x+Math.random()*r.w,sy=r.y+Math.random()*r.h,ang=Math.random()*6.283,fl=80+Math.random()*200;
      GP.push({kind:"in",t0:now+delay+80+Math.random()*80,d:480+Math.random()*180,sx,sy,tx:o.x+(Math.random()-.5)*60,ty:o.y+(Math.random()-.5)*60,
        cx:sx+Math.cos(ang)*fl,cy:sy+Math.sin(ang)*fl,s:8+Math.random()*11,a:.75,k:SPR[j%3],onEnd:pulseTile});}});
  gfxRun();return maxD;}
function gridKey(k){const N=APPS.length,list=sortedApps();
  if(k==="right")gi=Math.min(N-1,gi+1);else if(k==="left")gi=Math.max(0,gi-1);
  else if(k==="down")gi=Math.min(N-1,gi+6);else if(k==="up")gi=Math.max(0,gi-6);
  else if(k==="ok")return launch(list[gi].pkg);

/* ===== screensaver after 10 min ===== */
const PH=[1015,1016,1018,1022,1036,1039,1043,1044,1050,10,11,13,14,15,16,17,28,29];

function sPhoto(){const img=new Image();img.onload=()=>{if(!saverOn)return;const d=document.createElement("div");d.className="sp";
  d.style.backgroundImage=`url("${img.src}")`;$("saver").prepend(d);requestAnimationFrame(()=>requestAnimationFrame(()=>d.classList.add("on")));
  const o=sCur;sCur=d;if(o){o.classList.remove("on");setTimeout(()=>o.remove(),2100);}};
  img.src=`https://picsum.photos/id/${PH[Math.floor(Math.random()*PH.length)]}/1920/1080`;}
function startSaver(){if(saverOn)return;saverOn=true;tick();sPhoto();$("saver").classList.add("open");sT=setInterval(sPhoto,20000);}
function stopSaver(){saverOn=false;clearInterval(sT);$("saver").classList.remove("open");setTimeout(()=>{$("saver").querySelectorAll(".sp").forEach(e=>e.remove());sCur=null;},400);}
function bumpIdle(){clearTimeout(iT);iT=setTimeout(startSaver,6e5);}bumpIdle();

/* ===== self-update from GitHub (only when started through the loader) ===== */
const SRC="https://raw.githubusercontent.com/cruzin4bruzinrl-code/enkelhem/main/tv/index.html";
function checkUpdate(){let cur=null;try{cur=localStorage.getItem("hemPage");}catch(e){}if(cur===null)return;
  fetch(SRC+"?t="+Date.now(),{cache:"no-store"}).then(r=>r.ok?r.text():null).then(t=>{
    if(!t||t.indexOf("<html")<0||t===cur)return;try{localStorage.setItem("hemPage",t);}catch(e){}location.reload();}).catch(()=>{});}
setInterval(checkUpdate,15*60*1000);setTimeout(checkUpdate,20000);


/* ===== wiring ===== */
window.oceanKey=key;
/* called by the app whenever the window regains focus (also after volume popups etc.):
   only refresh when we actually came back from another app */
window.oceanShown=function(){checkUpdate();tick();if(!leftForApp)return;leftForApp=false;if(zone==="live"){render();return;}
  if(saverOn)stopSaver();if(zone!=="main"){["grid","places"].forEach(i=>$(i).classList.remove("open"));$("qp").classList.remove("open");zone="main";}
  buildOrbit();render();bumpIdle();};
addEventListener("keydown",e=>{const m={ArrowRight:"right",ArrowLeft:"left",ArrowUp:"up",ArrowDown:"down",Enter:"ok",Escape:"back",Backspace:"back",h:"hold",
   MediaPlayPause:"playkey",MediaPlay:"playkey",MediaPause:"playkey",p:"playkey",MediaRecord:"rec",ColorF0Red:"rec",r:"rec",
   MediaLast:"last",l:"last",AllApps:"allapps",a:"allapps",Guide:"guide",g:"guide",ContextMenu:"menu",m:"menu",ChannelUp:"chup",ChannelDown:"chdown"};
  let k=m[e.key];if(!k&&/^\d$/.test(e.key))k="n"+e.key;
  if(k){key(k);e.preventDefault();return;}
  console.log("okänd tangent "+e.key+" "+e.keyCode);});
function fit(){const s=Math.min(innerWidth/1920,innerHeight/1080),st=$("stage");st.style.transformOrigin="0 0";
  st.style.transform=`scale(${s})`;st.style.left=((innerWidth-1920*s)/2)+"px";st.style.top=((innerHeight-1080*s)/2)+"px";}
function noScroll(){[document.scrollingElement,document.body,$("stage")].forEach(e=>{if(e){e.scrollTop=0;e.scrollLeft=0;}});}
addEventListener("scroll",noScroll,true);
addEventListener("resize",fit);fit();
if(LS.get("fps",false)){fpsOn=true;$("fps").style.display="block";}
paintSpace();initEarth();applyPerf();buildOrbit();render();requestAnimationFrame(frame);

  LS.set("measuredFps",Math.round(n*1000/(t-t0)));}setTimeout(()=>requestAnimationFrame(m),1500);})();
