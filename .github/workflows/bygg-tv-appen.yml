name: Bygg TV-appen
on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/bygg-tv-appen.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.11.1" }
      - name: Bygg
        working-directory: android
        run: gradle assembleRelease --no-daemon
      - name: Publicera
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk hem.apk
          gh release delete app-latest --yes --cleanup-tag || true
          gh release create app-latest hem.apk --title "TV-appen (senaste)" --notes "Byggd automatiskt från commit ${{ github.sha }}"
