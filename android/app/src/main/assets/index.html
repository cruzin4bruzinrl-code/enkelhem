<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Hem</title>
<!-- HEM-v40 Nordic Calm -->
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;background:#010208;color:#fff;cursor:none;
  font-family:"SF Pro Display","Samsung Sans","Roboto","Segoe UI",system-ui,sans-serif;user-select:none;}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;background:#010208;}
:root{--ease:cubic-bezier(.32,.72,0,1);}

/* home: a still Nordic photo, a clock and one dock – nothing moves unless you press a key */
#bg{position:absolute;inset:0;background:#cfc3c6 center/cover no-repeat;transition:opacity 1.2s ease;}
#bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.10) 0%,rgba(255,255,255,0) 35%,rgba(20,18,26,0) 62%,rgba(20,18,26,.28) 100%);}
#home{position:absolute;inset:0;transition:opacity .8s ease;}
body.saving #bg,body.saving #home{opacity:0!important;}
body.saving #saver{background:transparent;}
.ov,#qp{z-index:20;}#toast,#fps{z-index:30;}#night{z-index:15;}#saver{z-index:25;}
.clock,.topr{color:#16181d;}
.clock{position:absolute;left:96px;top:70px;}
.theme{font-size:30px;font-weight:600;letter-spacing:.2px;opacity:.85;margin-bottom:46px;}
.clock .t{font-size:104px;font-weight:300;letter-spacing:-2px;line-height:1;}
.clock .d{font-size:32px;font-weight:500;opacity:.8;margin-top:10px;}
.topr{position:absolute;right:96px;top:78px;display:flex;align-items:center;gap:34px;opacity:.85;}
.topr svg{width:38px;height:38px;}
.wx{font-size:28px;font-weight:600;}
#wifi.off{opacity:.35;}
#dock{position:absolute;left:50%;bottom:88px;transform:translateX(-50%);display:flex;gap:30px;padding:26px 34px;border-radius:52px;
  background:rgba(250,247,250,.34);border:1.5px solid rgba(255,255,255,.55);box-shadow:0 30px 70px rgba(30,25,40,.25),inset 0 1px 0 rgba(255,255,255,.6);
  transition:transform .35s var(--ease);}
.dt{width:156px;height:156px;border-radius:38px;display:grid;place-items:center;position:relative;flex:0 0 auto;
  transition:transform .28s var(--ease),box-shadow .28s ease,background .28s ease;}
.dt .tile{width:116px;height:116px;border-radius:30px;display:grid;place-items:center;overflow:hidden;box-shadow:0 8px 18px rgba(0,0,0,.18);}
.dt .tile img{width:100%;height:100%;object-fit:cover;}
.dt .tile svg{width:58%;height:58%;color:#fff;}
.dt .tile .wm{font-size:21px;font-weight:800;color:#fff;text-align:center;line-height:1.05;padding:0 8px;}
.dt.focus{background:rgba(255,255,255,.62);transform:translateY(-14px) scale(1.08);box-shadow:0 18px 40px rgba(30,25,40,.3);}
#np{position:absolute;right:96px;top:170px;width:640px;display:flex;align-items:center;gap:26px;padding:22px 26px;border-radius:34px;
  background:rgba(250,247,250,.38);border:1.5px solid rgba(255,255,255,.55);color:#16181d;box-shadow:0 20px 50px rgba(30,25,40,.2);
  opacity:0;transform:translateY(-10px);transition:opacity .4s ease,transform .4s var(--ease),background .25s;}
#np.on{opacity:1;transform:none;}
#np.focus{background:rgba(255,255,255,.75);transform:scale(1.04);}
#np .art{width:120px;height:120px;border-radius:22px;background:#2a2d36 center/cover;flex:0 0 auto;box-shadow:0 8px 20px rgba(0,0,0,.2);}
#np .tx{min-width:0;flex:1;}
#np .app{font-size:20px;font-weight:600;opacity:.6;text-transform:uppercase;letter-spacing:1px;}
#np b{display:block;font-size:30px;font-weight:700;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#np small{display:block;font-size:24px;opacity:.75;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#np .pp{width:62px;height:62px;border-radius:50%;background:#16181d;flex:0 0 auto;display:grid;place-items:center;}
#np .pp svg{width:26px;height:26px;fill:#fff;}
#np .hint2{position:absolute;left:0;right:0;top:100%;margin-top:12px;text-align:center;font-size:20px;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.5);opacity:0;transition:opacity .2s;}
#np.focus .hint2{opacity:.9;}
#np .h2c{display:none;}#np.cont .h2c{display:block;}#np.cont .h2p{display:none;}
#np .art{display:grid;place-items:center;font-size:56px;font-weight:700;color:#fff;}
#dlabel{position:absolute;left:0;right:0;bottom:300px;text-align:center;font-size:34px;font-weight:600;color:#fff;
  text-shadow:0 2px 14px rgba(0,0,0,.45);transition:opacity .2s ease;}
#dlabel small{display:block;font-size:22px;font-weight:500;opacity:.85;margin-top:4px;}

/* top */
/* cards (Alla appar) */
.rc{width:262px;height:164px;border-radius:22px;overflow:hidden;position:relative;display:grid;place-items:center;
  background:#24262b;border:1.5px solid rgba(255,255,255,.08);transition:transform .4s var(--ease),box-shadow .3s;}
.recent .rc:first-child{width:400px;height:225px;}
.rc img.ban{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.rc img.ico{width:84px;height:84px;border-radius:20px;}
.rc .nm{position:absolute;left:0;right:0;bottom:0;padding:12px 16px;font-size:21px;font-weight:500;
  background:linear-gradient(transparent,rgba(0,0,0,.75));white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rc .wm{font-size:34px;font-weight:800;text-align:center;padding:0 12px;}
.rc .num{position:absolute;left:12px;top:10px;width:40px;height:40px;border-radius:12px;background:rgba(0,0,0,.6);
  display:grid;place-items:center;font-size:22px;font-weight:700;}
.rc.focus{transform:scale(1.06);box-shadow:0 22px 44px rgba(0,0,0,.5);z-index:2;}
.gw .rc.focus{box-shadow:0 0 0 3px #fff,0 22px 44px rgba(0,0,0,.5);}
.rc.media .mshade{position:absolute;inset:0;background:linear-gradient(transparent 40%,rgba(0,0,0,.82));}
.rc.media .mt{position:absolute;left:14px;right:14px;bottom:12px;display:flex;align-items:center;gap:10px;font-size:21px;font-weight:600;}
.rc.media .mt span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rc.media .mi{width:30px;height:30px;border-radius:8px;flex:0 0 auto;}
.rc.media .mplay{position:absolute;left:50%;top:42%;width:62px;height:62px;margin:-31px 0 0 -31px;border-radius:50%;background:rgba(0,0,0,.45);border:2px solid rgba(255,255,255,.8);}
.rc.media .mplay::after{content:"";position:absolute;left:24px;top:18px;border-left:20px solid #fff;border-top:13px solid transparent;border-bottom:13px solid transparent;}
.empty{font-size:25px;opacity:.5;align-self:center;}
/* overlays */
.ov{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .3s ease,visibility 0s linear .3s;}
.ov.open{opacity:1;visibility:visible;transition:opacity .3s ease;}
#grid{background:#cfc3c6 center/cover no-repeat;padding:80px 110px;color:#1d1b22;transition:opacity .45s ease,visibility 0s linear .45s;}
#grid.open{transition:opacity .45s ease;}
#grid::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,.08) 60%,rgba(20,18,26,.18));pointer-events:none;}
#grid>*{position:relative;}
#home{transition:opacity .45s ease,transform .5s var(--ease);}
body.gridon #home{opacity:0;transform:scale(.97);}
#grid .rc{background:rgba(250,247,250,.38);border:1.5px solid rgba(255,255,255,.55);box-shadow:0 10px 26px rgba(30,24,40,.14);}
#grid .gw .rc.focus{box-shadow:0 0 0 4px #fff,0 26px 50px rgba(30,24,40,.32);}
#grid .rc .wm{color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.25);}
.rc.icn{background:#f2f2f4;}
#grid .rc.icn{background:rgba(250,247,250,.5);}
#grid .rc.icn .nm{background:none;color:#1d1b22;text-align:center;font-weight:600;}
#grid .rc.icn img.ico{margin-bottom:26px;box-shadow:0 8px 18px rgba(30,24,40,.18);}
#grid h2,#places h2{font-size:44px;font-weight:600;}
.hint{font-size:23px;opacity:.55;margin:10px 0 36px;}
#grid .gw .rc{opacity:0;transform:translateY(26px) scale(.96);transition:opacity .35s ease,transform .5s var(--ease),box-shadow .3s;}
#grid h2,#grid .hint{transform:translateY(-24px);opacity:0;transition:opacity .45s ease .1s,transform .6s var(--ease) .1s;}
#grid.open h2{transform:none;opacity:1;}#grid.open .hint{transform:none;opacity:.7;}
#grid .gw .rc.lit{opacity:1;transform:none;}
#grid .gw .rc.lit.focus{transform:scale(1.06);}
.lhead{display:flex;align-items:center;gap:60px;margin-bottom:46px;}
#live{background:#03050d;padding:80px 110px;}
#live h2{font-size:44px;font-weight:600;}
.ltabs{display:flex;gap:16px;}
.ltab{font-size:28px;font-weight:600;padding:14px 34px;border-radius:40px;background:rgba(255,255,255,.07);opacity:.75;transition:background .25s,transform .35s var(--ease),opacity .25s;}
.ltab.sel{opacity:1;background:rgba(255,255,255,.16);}
.ltab.focus{background:#fff;color:#111;opacity:1;transform:scale(1.06);}
.lvp{height:760px;overflow:hidden;padding:14px;margin:-14px;}
.lgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:34px 30px;transition:transform .45s var(--ease);}
.lc{height:200px;border-radius:24px;position:relative;overflow:hidden;padding:26px 28px;display:flex;flex-direction:column;justify-content:flex-end;
  border:1.5px solid rgba(255,255,255,.08);transition:transform .4s var(--ease),box-shadow .3s;}
.lc .ln{font-size:40px;font-weight:800;letter-spacing:-.5px;line-height:1;}
.lc .ls{font-size:21px;opacity:.8;margin-top:10px;}
.lc .lv{position:absolute;left:24px;top:22px;font-size:17px;font-weight:700;letter-spacing:1.5px;padding:5px 12px;border-radius:8px;background:rgba(0,0,0,.35);}
.lc .lv::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;background:#ff4d4d;margin-right:8px;vertical-align:1px;}
.lc .lapp{position:absolute;right:24px;top:22px;font-size:17px;opacity:.75;}
.lc.focus{transform:scale(1.06);box-shadow:0 0 0 3px #fff,0 24px 50px rgba(0,0,0,.55);z-index:2;}
.lhint{position:absolute;left:110px;bottom:46px;font-size:22px;opacity:.5;}
.gvp{height:800px;overflow:hidden;padding:14px;margin:-14px;}
.gw{display:grid;grid-template-columns:repeat(6,1fr);gap:38px 30px;transition:transform .45s var(--ease);}
.gw .rc{width:auto;height:auto;aspect-ratio:16/10;}
#places{background:rgba(3,5,14,.96);padding:80px 110px;}
.pl{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;margin-top:36px;}
.pl div{font-size:27px;padding:20px 24px;border-radius:18px;background:rgba(255,255,255,.07);transition:transform .3s var(--ease),background .2s;}
.pl div.focus{background:#fff;color:#111;transform:scale(1.05);}

/* quick panel */
#qp{position:absolute;top:0;right:0;bottom:0;width:600px;background:rgba(10,13,28,.97);border-left:1.5px solid rgba(255,255,255,.1);
  padding:70px 44px;transform:translate3d(105%,0,0);transition:transform .5s var(--ease);
  box-shadow:-40px 0 80px rgba(0,0,0,.5);}
#qp.open{transform:none;}
#qp h2{font-size:40px;font-weight:600;margin-bottom:30px;}
.qvp{height:860px;overflow:hidden;margin:0 -10px;padding:0 10px;}
#qlist{transition:transform .45s var(--ease);}
.qi{display:flex;align-items:center;gap:22px;padding:18px 22px;border-radius:22px;margin-bottom:10px;transition:background .2s,transform .3s var(--ease);}
.qi .qic{width:62px;height:62px;border-radius:18px;background:rgba(255,255,255,.08);display:grid;place-items:center;flex:0 0 auto;}
.qi .qic svg{width:32px;height:32px;}
.qi b{display:block;font-size:28px;font-weight:600;}
.qi small{display:block;font-size:21px;opacity:.6;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:400px;}
.qi.focus{background:#fff;color:#111;transform:scale(1.03);}
.qi.focus .qic{background:rgba(0,0,0,.08);}
.ver{position:absolute;left:44px;bottom:34px;font-size:19px;opacity:.35;}

#toast{position:absolute;left:50%;bottom:70px;transform:translate3d(-50%,30px,0);background:#fff;color:#111;font-size:27px;font-weight:500;
  padding:22px 38px;border-radius:40px;opacity:0;transition:opacity .3s,transform .4s var(--ease);max-width:1300px;text-align:center;}
#toast.on{opacity:1;transform:translate3d(-50%,0,0);}
#fps{position:absolute;left:20px;top:20px;font:600 24px monospace;background:rgba(0,0,0,.7);padding:8px 14px;border-radius:10px;display:none;}
#night{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity 2s;}
#saver{background:#000;}
#saver .sp{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity 2s;}
#saver .sp.on{opacity:1;}
#saver .sc{position:absolute;right:90px;bottom:80px;text-align:right;text-shadow:0 4px 30px rgba(0,0,0,.6);}
#saver .sc .t{font-size:150px;font-weight:200;line-height:1;}
#saver .sc .d{font-size:34px;opacity:.9;margin-top:10px;}
</style>
</head>
<body>
<div id="stage">
  <div id="bg"></div>
  <div id="home">
    <div class="clock"><div class="t" id="ct">--:--</div><div class="d" id="cd"></div></div>
    <div class="topr">
      <div class="wx" id="wx"></div>
      <svg id="wifi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 8.5a15 15 0 0 1 20 0M5 12a10 10 0 0 1 14 0M8.5 15.5a5 5 0 0 1 7 0"/><circle cx="12" cy="19" r="1.4" fill="currentColor"/></svg>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </div>
    <div id="np"><div class="art" id="npart"></div><div class="tx"><div class="app" id="npapp"></div><b id="nptitle"></b><small id="npsub"></small></div>
      <div class="pp" id="nppp"></div><div class="hint2"><span class="h2p">◀ ▶ byt låt · OK paus/spela · ▼ tillbaka</span><span class="h2c">OK fortsätt · ◀ ta bort · ▼ tillbaka</span></div></div>
    <div id="dlabel"></div>
    <div id="dock"></div>
  </div>

  <div id="night"></div>

  <div id="grid" class="ov"><h2>Alla appar</h2><div class="hint">Håll in OK eller tryck ▶❚❚ för att fästa en app i dockan.</div><div class="gvp"><div class="gw" id="gw"></div></div></div>
  <div id="live" class="ov"><div class="lhead"><h2>Live-tv</h2><div class="ltabs" id="ltabs"></div></div>
    <div class="lvp"><div class="lgrid" id="lgrid"></div></div><div class="lhint" id="lhint"></div></div>
  <div id="places" class="ov"><h2>Välj ort för vädret</h2><div class="pl" id="pl"></div></div>

  <div id="qp">
    <h2>Snabbpanel</h2>
    <div class="qvp"><div id="qlist"></div></div>
    <div class="ver" id="ver"></div>
  </div>

  <div id="saver" class="ov"><div class="sc"><div class="t" id="st"></div><div class="d" id="sd"></div></div></div>
  <div id="toast"></div>
  <div id="fps"></div>
</div>

<script>
"use strict";
const VERSION="40.4";
let saverOn=false,sT=0,iT=0,sCur=null;
const B=window.OceanBridge;
const $=id=>document.getElementById(id);
const NEWAPP=!!(window.OceanBridge&&window.OceanBridge.memory);
const call=(fn,...a)=>{try{if(B&&B[fn])return B[fn](...a);}catch(e){}return null;};
const LS={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v);}catch(e){return d;}},
          set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};

/* ===== apps ===== */
const MOCK=[["Telia Play","se.telia.androidtv.launcher"],["YouTube","com.google.android.youtube.tv"],["SmartTube","org.smarttube.stable"],
 ["Stremio","com.stremio.one"],["SVT Play","se.svt.android.svtplay"],["TV4 Play","se.tv4.tv4playtab"],["Spotify","com.spotify.tv.android"],
 ["Max","com.wbd.stream"],["VLC","org.videolan.vlc"],["TV Bro","com.phlox.tvwebbrowser"],["Google Play Butik","com.android.vending"]]
 .map(([label,pkg])=>({label,pkg}));
const COL={"YouTube":"#ff0033","SmartTube":"#c62828","Stremio":"#5b3fd1","SVT Play":"#1e8c45","TV4 Play":"#e3002b","Spotify":"#1db954",
 "Max":"#002be7","VLC":"#ff8800","TV Bro":"#1a73e8","BrowseHere":"#1565c0","Telia Play":"#6a2bd9","Google Play Butik":"#2d3138"};
let APPS=[];try{const r=call("getApps");if(r)APPS=JSON.parse(r);}catch(e){}
if(!APPS.length)APPS=MOCK;
APPS=APPS.filter(a=>a.pkg!=="se.telia.androidtv.launcher");
const byPkg=p=>APPS.find(a=>a.pkg===p);
const find=re=>APPS.find(a=>re.test(a.label)||re.test(a.pkg));

/* recent + favourites */
const getRecent=()=>LS.get("recent",[]);
const getFav=()=>LS.get("fav",[]);
function remember(pkg){let r=getRecent().filter(x=>x.pkg!==pkg);r.unshift({pkg,t:Date.now()});LS.set("recent",r.slice(0,8));}
let leftForApp=false;
function launch(pkg,label){if(!pkg){toast((label||"Appen")+" finns inte på boxen");return;}remember(pkg);leftForApp=true;
  if(call("launch",pkg)===null&&!B)console.log("öppna",pkg);}
function ago(t){const m=Math.round((Date.now()-t)/6e4);if(m<1)return "nyss";if(m<60)return m+" min sedan";
  const h=Math.round(m/60);if(h<24)return h+" tim sedan";const d=Math.round(h/24);return d===1?"igår":d+" dagar sedan";}

function card(a,num){const c=document.createElement("div");c.className="rc f";c.dataset.pkg=a.pkg;
  if(a.banner)c.innerHTML=`<img class="ban" src="data:image/png;base64,${a.banner}">`;
  else if(a.icon){c.classList.add("icn");c.innerHTML=`<img class="ico" src="data:image/png;base64,${a.icon}"><div class="nm">${a.label}</div>`;}
  else{c.style.background=COL[a.label]||"#2a2c31";c.innerHTML=`<span class="wm">${a.label}</span>`;}
  if(num)c.insertAdjacentHTML("beforeend",`<div class="num">${num}</div>`);
  return c;}


/* ===== actions ===== */
const TELIA_LAUNCHER="se.telia.androidtv.launcher";
function browser(){return find(/browse ?here/i)||find(/tvwebbrowser|tv bro/i);}
function teliaPkg(){const s=APPS.find(a=>/telia/i.test(a.label+a.pkg)&&a.pkg!==TELIA_LAUNCHER&&!/teletext/i.test(a.pkg));return s?s.pkg:TELIA_LAUNCHER;}
function act(a,el){
  switch(a){
    case "apps":return openGrid();
    case "panel":return openPanel();
    case "resume":return launch(el.dataset.pkg);
    case "tv":return openLive();
    case "telia":case "content":{
      const section={tv:"Tv",content:"Mitt innehåll"}[a];
      if(B&&B.openTelia&&section){remember(TELIA_LAUNCHER);leftForApp=true;B.openTelia(section);return;}
      const p=teliaPkg();
      if(p===TELIA_LAUNCHER&&B&&!B.openUri){toast("Tryck HOME på fjärren för att komma till Telia");return;}
      if(section)toast("Välj "+section+" i Telias meny");return launch(p,"Telia");}
    case "youtube":{const y=byPkg("com.google.android.youtube.tv")||APPS.find(a=>/youtube/i.test(a.label)&&!/music|kids|smarttube/i.test(a.label+a.pkg));return launch(y&&y.pkg,"YouTube");}
    case "music":{const s=find(/spotify/i);return launch(s&&s.pkg,"Spotify");}
    case "store":return launch("com.android.vending","Play Butik");
    case "web":{const w=browser();return launch(w&&w.pkg,"BrowseHere");}
    case "account":{if(B&&B.openTelia){remember(TELIA_LAUNCHER);leftForApp=true;B.openTelia("Mitt konto");return;}const w=browser();if(B&&!B.openUri){toast("Gå till telia.se/mitt-telia i webbläsaren");return launch(w&&w.pkg,"BrowseHere");}if(w)remember(w.pkg);call("openUri","https://www.telia.se/mitt-telia",w?w.pkg:"");return;}
  }
}


/* ===== focus ===== */
let zone="main",gi=0,qi=0,pi=0;
function render(){noScroll();document.querySelectorAll(".focus").forEach(e=>e.classList.remove("focus"));
  if(zone==="grid"){const g=document.querySelectorAll("#gw .rc");if(g[gi]){g[gi].classList.add("focus");}return;}
  if(zone==="panel"){const q=document.querySelectorAll(".qi");if(q[qi]){q[qi].classList.add("focus");
    const it=q[qi],vh=860,top=it.offsetTop,bot=top+it.offsetHeight,max=Math.max(0,$("qlist").scrollHeight-vh);
    let off=Math.min(max,Math.max(0,bot-vh+40));if(top<off)off=Math.max(0,top-20);$("qlist").style.transform=`translateY(${-off}px)`;}return;}
  if(zone==="places"){const p=document.querySelectorAll("#pl div");if(p[pi]){p[pi].classList.add("focus");}return;}
  if(zone==="live"){const el=lr===0?document.querySelectorAll("#ltabs .ltab")[lt]:document.querySelectorAll("#lgrid .lc")[li];if(el)el.classList.add("focus");return;}
  if(zone==="player")$("np").classList.add("focus");else $("np").classList.remove("focus");
  if(zone==="main"||zone==="player")showSel();}
function toMain(){if(zone==="player"){zone="main";render();return;}if(zone==="grid")closeGrid();else if(zone==="live")closeLive();else if(zone==="panel")closePanel();
  else if(zone==="places"){$("places").classList.remove("open");zone="main";render();}}
function key(k){
  bumpIdle();
  if(saverOn){stopSaver();return;}
  if(k==="guide"){if(zone==="live")return closeLive();toMain();return openLive();}
  if(k==="chup"||k==="chdown"){if(zone==="live")return liveKey(k==="chup"?"up":"down");toMain();return openLive();}
  if(k==="menu"||k==="rec"){if(zone==="panel")return closePanel();if(zone==="places")return placeKey("back");toMain();return openPanel();}
  if(k==="allapps"){if(zone==="grid")return closeGrid();toMain();return openGrid();}
  if(k==="last"){const r=getRecent().map(x=>x.pkg).filter(byPkg);if(r[1])return launch(r[1]);if(r[0])return launch(r[0]);return toast("Ingen tidigare app än");}
  if(k==="playkey"){if(zone==="grid")return toggleFav(sortedApps()[gi].pkg);if(NP&&(zone==="main"||zone==="player"))return npCmd("toggle");if(CONT&&(zone==="main"||zone==="player"))return resumeCont();if(zone==="main"){const r=getRecent().find(x=>byPkg(x.pkg));
      if(r)return launch(r.pkg);return toast("Ingen app att fortsätta med än");}return;}
  if(/^n\d$/.test(k))return numKey(+k[1]);
  if(zone==="grid")return gridKey(k);
  if(zone==="live")return liveKey(k);
  if(zone==="panel")return panelKey(k);
  if(zone==="places")return placeKey(k);
  if(zone==="player")return playerKey(k);
  mainKey(k);}

let ORB=[],sel=0,lastKey="tv";
function buildOrbit(){
  const it=[],add=o=>{if(o&&!it.some(x=>x.key===o.key))it.push(o);};
  const app=(a,name)=>a&&!/netflix/i.test(a.label+a.pkg)?{key:a.pkg,pkg:a.pkg,name:name||a.label,desc:desc(a),col:brand(a),icon:a.icon,run:()=>launch(a.pkg,a.label)}:null;
  add({key:"tv",name:"Live-tv",desc:"Kanaler och tv-guide",col:"#2f6fd6",svg:GLYPH.tv,run:openLive});
  const yt=ytApp();add(yt?app(yt,"YouTube"):{key:"yt",name:"YouTube",desc:"Videor och klipp",col:"#ff2a3a",svg:GLYPH.yt,run:()=>act("youtube")});
  add(app(find(/disney/i)));add(app(find(/spotify/i)));add(app(find(/prime ?video|amazon/i),"Prime Video"));
  getFav().filter(Boolean).map(byPkg).forEach(a=>add(app(a)));
  add({key:"apps",name:"Appar",desc:"Alla dina appar",col:"rgba(255,255,255,.55)",svg:GLYPH.apps.replace('fill="currentColor"','fill="#3a3f4a"'),run:openGrid});
  add({key:"clean",name:"Rensa",desc:"Stänger appar som körs i bakgrunden",col:"rgba(255,255,255,.55)",svg:GLYPH.clean,run:cleanAll});
  add({key:"settings",name:"Inställningar",desc:"Boxens inställningar",col:"rgba(255,255,255,.55)",svg:GLYPH.gear.replace('stroke="currentColor"','stroke="#3a3f4a"'),run:()=>{leftForApp=true;call("action","settings");}});
  ORB=it;
  $("dock").innerHTML=ORB.map(o=>{const inner=o.icon?`<img src="data:image/png;base64,${o.icon}">`:o.svg?o.svg:`<span class="wm">${o.name}</span>`;
    return `<div class="dt"><div class="tile" style="background:${o.icon?"#fff":o.col||"#5a6b8c"}">${inner}</div></div>`;}).join("");
  ORB.forEach((o,i)=>o.el=$("dock").children[i]);
  const i=ORB.findIndex(o=>o.key===lastKey);sel=i>=0?i:0;showSel();}
function showSel(){const o=ORB[sel];if(!o)return;lastKey=o.key;
  ORB.forEach((x,i)=>x.el.classList.toggle("focus",i===sel&&zone==="main"));
  $("dlabel").innerHTML=`${o.name}<small>${o.desc}</small>`;
  /* many favourites: slide the dock so the chosen tile stays on screen */
  const n=ORB.length,w=186,full=n*w+38,max=1760;let dx=0;
  if(full>max){const c=sel*w+w/2+38;dx=Math.max(-(full-max)/2,Math.min((full-max)/2,full/2-c));}
  $("dock").style.transform=`translateX(calc(-50% + ${dx}px))`;}
function setSel(i){sel=Math.max(0,Math.min(ORB.length-1,i));showSel();}
function activate(){const o=ORB[sel];if(!o)return;try{o.run();}catch(e){toast(o.name+" gick inte att öppna");}}
/* ===== now playing: Spotify or other music shows a small player on the home screen ===== */
let NP=null,npKey="";
const PLAY='<svg viewBox="0 0 24 24"><path d="M7 4l14 8-14 8z"/></svg>',PAUSE='<svg viewBox="0 0 24 24"><rect x="5" y="4" width="5" height="16" rx="1"/><rect x="14" y="4" width="5" height="16" rx="1"/></svg>';
function npPoll(){if(!B||!B.nowPlaying||document.hidden||saverOn)return;let o=null;try{o=JSON.parse(B.nowPlaying(npKey));}catch(e){}
  const el=$("np");
  if(!o||!o.title){NP=null;showCont();return;}
  if(CONT){CONT=null;el.classList.remove("cont");$("npart").textContent="";$("npart").style.backgroundColor="";}
  if(o.art){$("npart").style.backgroundImage=`url(data:image/jpeg;base64,${o.art})`;npKey=o.key;}else if(o.key!==npKey){$("npart").style.backgroundImage="";npKey=o.key;}
  $("npapp").textContent=o.app||"";$("nptitle").textContent=o.title;$("npsub").textContent=o.sub||"";$("nppp").innerHTML=o.playing?PAUSE:PLAY;
  NP=o;el.classList.add("on");}
setInterval(npPoll,2000);setTimeout(npPoll,600);
/* ===== Fortsätt: the last thing that played, when nothing plays now ===== */
let CONT=null;
function contItem(){const now=Date.now(),D=3*864e5;let m=null;try{m=JSON.parse(B&&B.lastMedia?B.lastMedia():"null");}catch(e){}
  const ch=LS.get("lastch",null);if(m&&now-m.t>D)m=null;const c=ch&&now-ch.t<D?ch:null;
  const tvm=m&&(m.pkg===TELIA_LAUNCHER||/pluto/.test(m.pkg));
  if(c&&(!m||tvm||c.t>m.t)){const fresh=tvm&&m.t>c.t;return{ch:c.c,app:"Live-tv",title:c.c.n,sub:fresh?m.title:(c.c.d||""),art:fresh?m.art:null,col:c.c.col,key:"ch|"+c.c.n};}
  if(m&&byPkg(m.pkg))return{pkg:m.pkg,app:m.app||"",title:m.title,sub:m.sub,art:m.art,key:m.pkg+"|"+m.title};return null;}
function showCont(){const el=$("np"),c=contItem();
  if(!c){if(CONT||el.classList.contains("on")){CONT=null;el.classList.remove("on","focus","cont");if(zone==="player"){zone="main";render();}}return;}
  if(!CONT||CONT.key!==c.key){$("npart").style.backgroundImage=c.art?`url(data:image/jpeg;base64,${c.art})`:"";$("npart").style.backgroundColor=c.art?"":(c.col||"#2a2d36");
    $("npart").textContent=c.art?"":(c.title||"").slice(0,1);npKey="";}
  CONT=c;$("npapp").textContent="Fortsätt · "+c.app;$("nptitle").textContent=c.title;$("npsub").textContent=c.sub||"";$("nppp").innerHTML=PLAY;
  el.classList.add("on","cont");}
function resumeCont(){const c=CONT;if(!c)return;
  if(c.ch)return playLive(c.ch);
  if(B&&B.resumeMedia&&B.resumeMedia(c.pkg)){setTimeout(npPoll,500);return;}launch(c.pkg);}
function forgetCont(){if(B&&B.forgetMedia)B.forgetMedia();LS.set("lastch",null);CONT=null;$("np").classList.remove("on","focus","cont");zone="main";render();toast("Borttaget");}
function cleanAll(){const r=call("freeMemory");setTimeout(npPoll,700);if(r===null)return toast("Kräver nya appversionen");
  try{const m=JSON.parse(r);toast("Bakgrundsappar stängda · "+Math.max(0,Math.round(m.after-m.before))+" MB frigjort");}catch(e){toast("Bakgrundsappar stängda");}}
function npCmd(c){call("mediaCmd",c);setTimeout(npPoll,450);setTimeout(npPoll,1500);}
function playerKey(k){if(!NP&&CONT){if(k==="ok")return resumeCont();if(k==="left")return forgetCont();if(k==="up"){zone="main";return openPanel();}if(k==="down"||k==="back"){zone="main";render();}return;}
  if(k==="left")return npCmd("prev");if(k==="right")return npCmd("next");if(k==="ok")return npCmd("toggle");
  if(k==="up"){zone="main";return openPanel();}if(k==="down"||k==="back"){zone="main";render();}}
function mainKey(k){
  if(k==="left")setSel(sel-1);else if(k==="right")setSel(sel+1);
  else if(k==="up"&&(NP||CONT)){zone="player";render();}
  else if(k==="ok")activate();else if(k==="up")openPanel();else if(k==="down")openGrid();
  else if(k==="back")setSel(ORB.findIndex(o=>o.key==="tv"));
  else if(k==="hold"){const o=ORB[sel];if(o&&o.pkg)toggleFav(o.pkg);}}

/* ===== favourites + number keys ===== */
function toggleFav(pkg){let f=getFav();const a=byPkg(pkg);
  if(f.includes(pkg)){toast((a?a.label:"Appen")+" lossad");f=f.map(x=>x===pkg?"":x);}
  else{const free=f.indexOf("");const slot=free>=0?free:f.length;if(slot>=9){toast("Max 9 fästa appar");return;}f[slot]=pkg;toast((a?a.label:"Appen")+" fäst på "+(slot+1));}
  LS.set("fav",f);buildOrbit();if(zone==="grid"){const keep=gi;fillGrid();gi=keep;render();}}
function pinTo(pkg,n){let f=getFav().filter(x=>x!==pkg);while(f.length<n-1)f.push("");f[n-1]=pkg;f=f.slice(0,9);
  LS.set("fav",f);buildOrbit();const a=byPkg(pkg);toast((a?a.label:"Appen")+" fäst på "+n);const keep=gi;fillGrid();gi=keep;render();}
function numKey(n){if(zone==="grid"&&n>0){return pinTo(sortedApps()[gi].pkg,n);}if(n===0){toggleFps();return;}const f=getFav();
  if(f[n-1])launch(f[n-1]);else toast("Inget fäst på "+n+". Håll in OK på en app i Alla appar.");}

function shade(hex,p){const n=parseInt(hex.slice(1),16);const f=v=>Math.max(0,Math.min(255,Math.round(v+v*p/100)));
  return "#"+[(n>>16)&255,(n>>8)&255,n&255].map(v=>f(v).toString(16).padStart(2,"0")).join("");}

const KSRC="https://raw.githubusercontent.com/cruzin4bruzinrl-code/enkelhem/main/tv/kanaler.txt";
function parseKanaler(t){const tabs=[];
  t.split("\n").forEach(l=>{l=l.trim();if(!l||l[0]==="#")return;const[k,n,u,tab,s,c]=l.split("|");if(!n||!tab)return;
    let T=tabs.find(x=>x.tab===tab);if(!T){T={tab,ch:[]};tabs.push(T);}
    T.ch.push({k,n,s:s||"",c:c||"#2a2c31",u:k==="yt"?YT(u):u,tg:k==="telia"?u:null});});
  return tabs.length?tabs:null;}
function loadKanaler(){try{const c=LS.get("kanaler",null);if(c){const p=parseKanaler(c);if(p)LIVE.splice(0,LIVE.length,...p);}}catch(e){}
  fetch(KSRC+"?t="+Date.now(),{cache:"no-store"}).then(r=>r.ok?r.text():null).then(t=>{const p=t&&parseKanaler(t);
    if(p){LS.set("kanaler",t);LIVE.splice(0,LIVE.length,...p);if(zone==="live")fillLive();}}).catch(()=>{});}
loadKanaler();
let lt=0,lr=1,li=0,lOff=0;
function openLive(){loadKanaler();lt=0;lr=1;li=0;zone="live";fillLive();$("live").classList.add("open");render();}
function closeLive(){$("live").classList.remove("open");zone="main";render();}
function fillLive(){
  $("ltabs").style.display=LIVE.length>1?"":"none";
  $("ltabs").innerHTML=LIVE.map((t,i)=>`<div class="ltab${i===lt?" sel":""}">${t.tab}</div>`).join("");
  $("lgrid").innerHTML=LIVE[lt].ch.map(c=>`<div class="lc" style="background:linear-gradient(150deg,${c.c},${shade(c.c,-45)})"><div class="lv">LIVE</div>
      ${c.k==="telia"?'<div class="lapp">Via Telia</div>':""}<div class="ln">${c.n}</div><div class="ls">${c.s}</div></div>`).join("");
  $("lhint").textContent="OK startar kanalen · Bakåt stänger";
  lOff=0;$("lgrid").style.transform="";}
function liveKey(k){const n=LIVE[lt].ch.length;
  if(lr===0&&LIVE.length<2)lr=1;
  if(lr===0){if(k==="left"&&lt>0){lt--;li=0;fillLive();}else if(k==="right"&&lt<LIVE.length-1){lt++;li=0;fillLive();}
    else if(k==="down"){lr=1;li=0;}else if(k==="back")return closeLive();render();return;}
  if(k==="right")li=Math.min(n-1,li+1);else if(k==="left")li=Math.max(0,li-1);
  else if(k==="down")li=Math.min(n-1,li+4);else if(k==="up"){if(li<4){if(LIVE.length>1){lr=0;render();}return;}li-=4;}
  else if(k==="ok")return playLive(LIVE[lt].ch[li]);else if(k==="back")return closeLive();
  render();const g=document.querySelectorAll("#lgrid .lc")[li];if(g){const row=Math.floor(li/4),rh=g.offsetHeight+34;
    lOff=-Math.max(0,row-2)*rh;$("lgrid").style.transform=`translateY(${lOff}px)`;}}
function playLive(c){LS.set("lastch",{c,t:Date.now()});
  if(c.k==="telia"){if(B&&B.openTelia){remember(TELIA_LAUNCHER);leftForApp=true;B.openTelia("Tv"+(c.tg?":"+c.tg:""));}else toast("Tryck HOME för att komma till Telia");return;}
  if(c.k==="pluto"){if(B&&B.openUri){const u="https://pluto.tv/live-tv/"+c.u,cold=Date.now()-LS.get("plutoT",0)>6e5;LS.set("plutoT",Date.now());remember("tv.pluto.android");leftForApp=true;B.openUri(u,"tv.pluto.android");if(cold)setTimeout(()=>{if(leftForApp)B.openUri(u,"tv.pluto.android");},4000);}else toast("Spelas upp på TV:n");return;}
  if(!(B&&B.play)){toast(B?"Kräver nya appversionen: skriv tv uppdatera":"Spelas upp på TV:n");return;}
  leftForApp=true;B.play(c.k,c.u,c.n);}

/* ===== all apps ===== */
function sortedApps(){const f=getFav().filter(Boolean);return [...f.map(byPkg).filter(Boolean),...APPS.filter(a=>!f.includes(a.pkg))];}
function fillGrid(){const w=$("gw"),wasOpen=$("grid").classList.contains("open");w.innerHTML="";const f=getFav();
  sortedApps().forEach(a=>{const i=f.indexOf(a.pkg);const c=card(a,i>=0?i+1:0);if(wasOpen)c.classList.add("lit");w.appendChild(c);});}
let gOff=0;
function openGrid(){fillGrid();gi=0;gOff=0;zone="grid";$("gw").style.transform="";$("grid").classList.add("open");document.body.classList.add("gridon");render();
  requestAnimationFrame(()=>requestAnimationFrame(gridIn));}
function closeGrid(){gridOut();zone="main";document.body.classList.remove("gridon");setTimeout(()=>{$("grid").classList.remove("open");setTimeout(()=>{if(zone!=="grid")$("gw").innerHTML="";},400);},120);render();}
function gridIn(){const cards=[...document.querySelectorAll("#gw .rc")];cards.forEach((c,i)=>{c.style.transitionDelay=Math.min(i,18)*18+"ms";c.classList.add("lit");});}
function gridOut(){document.querySelectorAll("#gw .rc.lit").forEach(c=>{c.style.transitionDelay="0ms";c.classList.remove("lit");});return 0;}
function gridKey(k){const N=APPS.length,list=sortedApps();
  if(k==="right")gi=Math.min(N-1,gi+1);else if(k==="left")gi=Math.max(0,gi-1);
  else if(k==="down")gi=Math.min(N-1,gi+6);else if(k==="up")gi=Math.max(0,gi-6);
  else if(k==="ok")return launch(list[gi].pkg);
  else if(k==="hold")return toggleFav(list[gi].pkg);
  else if(k==="back")return closeGrid();
  render();gridScroll();}
function gridScroll(){const g=document.querySelectorAll("#gw .rc")[gi];if(!g)return;const rowH=g.offsetHeight+38,row=Math.floor(gi/6);
  const maxRow=Math.max(0,Math.ceil(APPS.length/6)-Math.floor(800/rowH));gOff=-Math.min(Math.max(0,row-1),maxRow)*rowH;$("gw").style.transform=`translateY(${gOff}px)`;}

function btText(){const r=call("bluetooth");if(r===null)return B?"Öppnar Bluetooth-inställningar":"Visar anslutna hörlurar";
  try{const b=JSON.parse(r);if(!b.perm)return "Behörighet saknas";if(!b.enabled)return "Bluetooth är av";
    const c=b.devices.filter(d=>d.connected);return c.length?c.map(d=>d.name).join(", ")+" ansluten":"Inga hörlurar anslutna";}catch(e){return "";}}
function memText(){const r=call("memory");if(r===null)return B?"Kräver nästa appversion":"Stänger appar i bakgrunden";
  try{const m=JSON.parse(r);return (m.avail/1024).toFixed(1)+" GB ledigt av "+(m.total/1024).toFixed(1)+" GB";}catch(e){return "";}}
function netText(){const r=call("network");if(r===null)return B?"Öppnar inställningar":"Visar anslutning";
  try{const n=JSON.parse(r);return n.type==="none"?"Ingen anslutning":(n.type==="wifi"?"Wi-Fi":"Kabel")+(n.ip?" · "+n.ip:"");}catch(e){return "";}}
function devName(){return call("deviceName")||"TV:n";}
function qItems(){const perf=LS.get("perf",false),fps=LS.get("fps",false),ort=(LS.get("ort",null)||{name:"Stockholm"}).name;
  return [
   ["bt","Hörlurar",btText(),()=>call("action",NEWAPP?"bluetooth":"settings")],
   ["cast","Spegla telefonen",'Casta till "'+devName()+'"',()=>toast('Öppna Smart View eller Casta på telefonen och välj "'+devName()+'"')],
   ["mem","Frigör minne",memText(),freeMem],
   ["net","Nätverk",netText(),()=>call("action",NEWAPP?"wifi":"settings")],
   ["sun","Väderort",ort,openPlaces],
   ["sun","Skärmsläckare","Partiklar · startar efter 10 min, OK visar den nu",()=>{closePanel();setTimeout(startSaver,400);}],
   ["img","Mitt innehåll","Inspelat och sparat hos Telia",()=>act("content")],
   ["set","Mitt konto","Ditt Telia-konto",()=>act("account")],
   ["spark","Prestandaläge",perf?"På":"Av",()=>{LS.set("perf",!perf);applyPerf();fillPanel();}],
   ["fps","FPS-mätare",(fps?"På":"Av")+" · boxen mätte "+LS.get("measuredFps","?")+" FPS",()=>{toggleFps();fillPanel();}],
   ["set","Inställningar","Boxens inställningar",()=>call("action","settings")]];}
let QI=[];
function fillPanel(){QI=qItems();$("qlist").innerHTML=QI.map(([ic,t,s])=>
  `<div class="qi"><div class="qic"><svg viewBox="0 0 24 24">${IC[ic]}</svg></div><div><b>${t}</b><small>${s}</small></div></div>`).join("");
  $("ver").textContent="Version "+VERSION;render();}
function openPanel(){qi=0;zone="panel";$("qlist").style.transform="";fillPanel();$("qp").classList.add("open");}
function closePanel(){$("qp").classList.remove("open");zone="main";render();}
function panelKey(k){if(k==="down")qi=Math.min(QI.length-1,qi+1);else if(k==="up")qi=Math.max(0,qi-1);
  else if(k==="ok"){QI[qi][3]();return;}else if(k==="back"||k==="left")return closePanel();render();}
function freeMem(){const r=call("freeMemory");if(r===null){toast("Kräver nästa appversion (byggs på datorn)");return;}
  try{const m=JSON.parse(r);const d=Math.max(0,Math.round(m.after-m.before));toast("Frigjorde "+d+" MB · "+(m.after/1024).toFixed(1)+" GB ledigt");}catch(e){}fillPanel();}

 ["Östersund",63.18,14.64],["Kalmar",56.66,16.36],["Kristianstad",56.03,14.16],["Falun",60.61,15.63]];

  pi=Math.max(0,PLACES.findIndex(p=>p[0]===cur));zone="places";$("places").classList.add("open");render();}
function placeKey(k){const N=PLACES.length;
  if(k==="right")pi=Math.min(N-1,pi+1);else if(k==="left")pi=Math.max(0,pi-1);
  else if(k==="down")pi=Math.min(N-1,pi+5);else if(k==="up")pi=Math.max(0,pi-5);

  render();}

/* ===== toast ===== */
let tT=0;function toast(m){const t=$("toast");t.textContent=m;t.classList.add("on");clearTimeout(tT);tT=setTimeout(()=>t.classList.remove("on"),m.length>60?9000:3200);}

/* ===== FPS meter ===== */
let fpsOn=false,fc=0,fl=0;
function toggleFps(){fpsOn=!LS.get("fps",false);LS.set("fps",fpsOn);$("fps").style.display=fpsOn?"block":"none";
  toast("FPS-mätare "+(fpsOn?"på":"av"));if(fpsOn)requestAnimationFrame(fpsLoop);}
/* the FPS meter is the only thing that runs every frame, and only while it is switched on */
function fpsLoop(t){if(!fpsOn)return;requestAnimationFrame(fpsLoop);fc++;if(t-fl>=1000){$("fps").textContent="FPS "+fc;fc=0;fl=t;}}

/* ===== clock, weather, night dim ===== */
const DAG=["söndag","måndag","tisdag","onsdag","torsdag","fredag","lördag"],MAN=["januari","februari","mars","april","maj","juni","juli","augusti","september","oktober","november","december"];
function dateTxt(d){const x=DAG[d.getDay()];return x[0].toUpperCase()+x.slice(1)+" "+d.getDate()+" "+MAN[d.getMonth()];}
function hhmm(d){return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");}
const DK=["Sön","Mån","Tis","Ons","Tor","Fre","Lör"],MK=["jan","feb","mar","apr","maj","jun","jul","aug","sep","okt","nov","dec"];
function wifi(){const r=call("network");if(r===null)return;try{$("wifi").classList.toggle("off",JSON.parse(r).type==="none");}catch(e){}}
function tick(){const d=new Date();$("ct").textContent=hhmm(d);$("cd").textContent=DK[d.getDay()]+" "+d.getDate()+" "+MK[d.getMonth()];wifi();
  const h=d.getHours();$("night").style.opacity=(h>=22||h<6)?.22:0;if(saverOn){$("st").textContent=hhmm(d);$("sd").textContent=dateTxt(d);}}
setInterval(tick,15000);tick();
const WI={0:"☀️",1:"🌤️",2:"⛅",3:"☁️",45:"🌫️",48:"🌫️",51:"🌦️",53:"🌦️",55:"🌧️",61:"🌦️",63:"🌧️",65:"🌧️",71:"🌨️",73:"🌨️",75:"❄️",80:"🌦️",81:"🌧️",82:"🌧️",95:"⛈️"};
async function weather(){try{const o=LS.get("ort",null)||{lat:59.33,lon:18.07};
  const d=await(await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${o.lat}&longitude=${o.lon}&current=temperature_2m,weather_code&timezone=auto`)).json();
  $("wx").textContent=(WI[d.current.weather_code]||"🌡️")+" "+Math.round(d.current.temperature_2m)+"°";}catch(e){}}
weather();setInterval(weather,18e5);

/* ===== screensaver after 10 min ===== */
const PH=[1015,1016,1018,1022,1036,1039,1043,1044,1050,10,11,13,14,15,16,17,28,29];

function sPhoto(){const img=new Image();img.onload=()=>{if(!saverOn)return;const d=document.createElement("div");d.className="sp";
  d.style.backgroundImage=`url("${img.src}")`;$("saver").prepend(d);requestAnimationFrame(()=>requestAnimationFrame(()=>d.classList.add("on")));
  const o=sCur;sCur=d;if(o){o.classList.remove("on");setTimeout(()=>o.remove(),2100);}};
  img.src=`https://picsum.photos/id/${PH[Math.floor(Math.random()*PH.length)]}/1920/1080`;}
function startSaver(){if(saverOn)return;
  /* close whatever is open (Alla appar, Live-tv, panel) so the turning Earth is what you see */
  if(zone==="live")$("live").classList.remove("open");["grid","places"].forEach(i=>$(i).classList.remove("open"));$("qp").classList.remove("open");
  if(zone!=="main"){zone="main";render();}
  saverOn=true;tick();
  if(NATIVE_EARTH){earthState();try{B.earthSaver(true);}catch(e){}document.body.classList.add("saving");$("saver").classList.add("open");return;}
  sPhoto();$("saver").classList.add("open");sT=setInterval(sPhoto,20000);}
function stopSaver(){saverOn=false;setTimeout(earthState,1300);clearInterval(sT);$("saver").classList.remove("open");if(NATIVE_EARTH){try{B.earthSaver(false);}catch(e){}document.body.classList.remove("saving");}setTimeout(()=>{$("saver").querySelectorAll(".sp").forEach(e=>e.remove());sCur=null;},400);}
function bumpIdle(){clearTimeout(iT);iT=setTimeout(startSaver,6e5);}bumpIdle();

/* ===== self-update from GitHub (only when started through the loader) ===== */
const SRC="https://raw.githubusercontent.com/cruzin4bruzinrl-code/enkelhem/main/tv/index.html";
function checkUpdate(){let cur=null;try{cur=localStorage.getItem("hemPage");}catch(e){}if(cur===null)return;
  fetch(SRC+"?t="+Date.now(),{cache:"no-store"}).then(r=>r.ok?r.text():null).then(t=>{
    if(!t||t.indexOf("<html")<0||t===cur)return;try{localStorage.setItem("hemPage",t);}catch(e){}location.reload();}).catch(()=>{});}
setInterval(checkUpdate,15*60*1000);setTimeout(checkUpdate,20000);


/* ===== wiring ===== */
window.oceanKey=key;
/* called by the app whenever the window regains focus (also after volume popups etc.):
   only refresh when we actually came back from another app */
window.oceanShown=function(){checkUpdate();tick();if(!leftForApp)return;leftForApp=false;if(zone==="live"){render();return;}
  if(saverOn)stopSaver();if(zone!=="main"){["grid","places"].forEach(i=>$(i).classList.remove("open"));$("qp").classList.remove("open");zone="main";}
  buildOrbit();render();bumpIdle();};
addEventListener("keydown",e=>{const m={ArrowRight:"right",ArrowLeft:"left",ArrowUp:"up",ArrowDown:"down",Enter:"ok",Escape:"back",Backspace:"back",h:"hold",
   MediaPlayPause:"playkey",MediaPlay:"playkey",MediaPause:"playkey",p:"playkey",MediaRecord:"rec",ColorF0Red:"rec",r:"rec",
   MediaLast:"last",l:"last",AllApps:"allapps",a:"allapps",Guide:"guide",g:"guide",ContextMenu:"menu",m:"menu",ChannelUp:"chup",ChannelDown:"chdown"};
  let k=m[e.key];if(!k&&/^\d$/.test(e.key))k="n"+e.key;
  if(k){key(k);e.preventDefault();return;}
  console.log("okänd tangent "+e.key+" "+e.keyCode);});
function fit(){const s=Math.min(innerWidth/1920,innerHeight/1080),st=$("stage");st.style.transformOrigin="0 0";
  st.style.transform=`scale(${s})`;st.style.left=((innerWidth-1920*s)/2)+"px";st.style.top=((innerHeight-1080*s)/2)+"px";}
function noScroll(){[document.scrollingElement,document.body,$("stage")].forEach(e=>{if(e){e.scrollTop=0;e.scrollLeft=0;}});}
addEventListener("scroll",noScroll,true);
addEventListener("resize",fit);fit();
if(LS.get("fps",false)){fpsOn=true;$("fps").style.display="block";requestAnimationFrame(fpsLoop);}
setBg();initEarth();applyPerf();buildOrbit();render();earthState();
(function(){let n=0,t0=0;function m(t){if(!t0)t0=t;n++;if(t-t0<2000)return requestAnimationFrame(m);
  LS.set("measuredFps",Math.round(n*1000/(t-t0)));}setTimeout(()=>requestAnimationFrame(m),1500);})();
