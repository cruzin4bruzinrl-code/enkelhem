<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Hem</title>
<!-- HEM-v19 -->
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;background:#0c0d0f;color:#fff;cursor:none;
  font-family:"SF Pro Display","Samsung Sans","Roboto","Segoe UI",system-ui,sans-serif;user-select:none;}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;
  background:radial-gradient(120% 90% at 50% 0%,#2b2d33 0%,#17181b 55%,#0c0d0f 100%);}
#bg{position:absolute;inset:0;}
.bgl{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity 1.2s ease;}
.bgl.on{opacity:1;}
#shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.5) 0%,rgba(0,0,0,.12) 32%,rgba(0,0,0,.3) 58%,rgba(0,0,0,.82) 100%);}
#blob{position:absolute;left:0;top:0;width:100px;height:100px;border-radius:40px;overflow:hidden;opacity:0;pointer-events:none;
  transform-origin:0 0;will-change:transform;transition:opacity .3s;
  background:var(--acc,#fff);box-shadow:0 0 44px var(--acc,#fff);}
#blob.on{opacity:1;}
#blob .spin{position:absolute;left:50%;top:50%;width:900px;height:900px;margin:-450px 0 0 -450px;
  background:linear-gradient(90deg,rgba(255,255,255,0) 0%,rgba(255,255,255,0) 38%,rgba(255,255,255,.95) 50%,rgba(255,255,255,0) 62%,rgba(255,255,255,0) 100%);
  will-change:transform,opacity;}
@keyframes spin{to{transform:rotate(360deg);}}
@keyframes pulse{50%{opacity:.62;}}

.clock,.lbl,.kick,.ctitle,.cmeta,.wx{text-shadow:0 2px 16px rgba(0,0,0,.55);}
#fx{position:absolute;inset:0;width:1920px;height:1080px;pointer-events:none;}
:root{--ease:cubic-bezier(.32,.72,0,1);}

/* top */
.clock{position:absolute;left:96px;top:70px;}
.clock .t{font-size:118px;font-weight:300;letter-spacing:-2px;line-height:1;}
.clock .d{font-size:32px;opacity:.8;margin-top:14px;}
.topr{position:absolute;right:96px;top:84px;display:flex;align-items:center;gap:18px;}
.pill{height:62px;padding:0 30px;border-radius:31px;display:flex;align-items:center;gap:12px;font-size:25px;font-weight:500;
  background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.14);transition:background .25s,color .25s,transform .35s var(--ease);}
.pill svg,.icon svg{width:30px;height:30px;}
.icon{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.08);
  border:1.5px solid rgba(255,255,255,.14);transition:background .25s,color .25s,transform .35s var(--ease);}
.wx{font-size:27px;font-weight:500;opacity:.9;margin-right:8px;}
.focus.pill,.focus.icon{background:#fff;color:#111;transform:scale(1.07);}

/* tiles */
.tiles{position:absolute;left:0;right:0;top:330px;display:flex;justify-content:center;gap:32px;}
.tile{width:222px;display:flex;flex-direction:column;align-items:center;}
.sq{width:222px;height:204px;border-radius:32px;display:grid;place-items:center;position:relative;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12);border:1.5px solid rgba(255,255,255,.06);
  transition:transform .4s var(--ease),box-shadow .3s ease;
  -webkit-box-reflect:below 76px linear-gradient(transparent 70%,rgba(255,255,255,.09));}
.perf .sq{-webkit-box-reflect:none;}
.sq svg{width:96px;height:96px;color:rgba(255,255,255,.92);}
.lbl{margin-top:22px;font-size:29px;font-weight:500;opacity:.85;}
.tile.focus .sq{transform:scale(1.08);box-shadow:0 22px 44px rgba(0,0,0,.45);}
.tile.focus .lbl{opacity:1;}
.brand{font-weight:800;font-size:32px;text-align:center;line-height:1.05;}
.brand small{display:block;font-size:22px;font-weight:600;letter-spacing:3px;opacity:.8;margin-top:6px;}

/* continue */
.cont{position:absolute;left:96px;right:96px;top:742px;display:flex;align-items:flex-end;gap:56px;}
.cinfo{width:520px;flex:0 0 auto;}
.kick{font-size:21px;letter-spacing:3px;font-weight:600;opacity:.6;}
.ctitle{font-size:50px;font-weight:600;margin-top:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cmeta{font-size:25px;opacity:.65;margin-top:10px;}
.play{margin-top:26px;display:inline-flex;align-items:center;gap:14px;height:66px;padding:0 34px;border-radius:33px;
  font-size:27px;font-weight:500;border:2px solid rgba(255,255,255,.6);transition:background .25s,color .25s,transform .35s var(--ease);}
.play svg{width:22px;height:22px;}
.play.focus{background:#fff;color:#111;border-color:#fff;transform:scale(1.05);}
.recent{display:flex;gap:30px;align-items:flex-end;}
.rc{width:262px;height:164px;border-radius:22px;overflow:hidden;position:relative;display:grid;place-items:center;
  background:#24262b;border:1.5px solid rgba(255,255,255,.08);transition:transform .4s var(--ease),box-shadow .3s;}
.recent .rc:first-child{width:400px;height:225px;}
.rc img.ban{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.rc img.ico{width:84px;height:84px;border-radius:20px;}
.rc .nm{position:absolute;left:0;right:0;bottom:0;padding:12px 16px;font-size:21px;font-weight:500;
  background:linear-gradient(transparent,rgba(0,0,0,.75));white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rc .wm{font-size:34px;font-weight:800;text-align:center;padding:0 12px;}
.rc .num{position:absolute;left:12px;top:10px;width:40px;height:40px;border-radius:12px;background:rgba(0,0,0,.6);
  display:grid;place-items:center;font-size:22px;font-weight:700;}
.rc.focus{transform:scale(1.06);box-shadow:0 22px 44px rgba(0,0,0,.5);z-index:2;}
.gw .rc.focus{box-shadow:0 0 0 3px #fff,0 22px 44px rgba(0,0,0,.5);}
.rc.media .mshade{position:absolute;inset:0;background:linear-gradient(transparent 40%,rgba(0,0,0,.82));}
.rc.media .mt{position:absolute;left:14px;right:14px;bottom:12px;display:flex;align-items:center;gap:10px;font-size:21px;font-weight:600;}
.rc.media .mt span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rc.media .mi{width:30px;height:30px;border-radius:8px;flex:0 0 auto;}
.rc.media .mplay{position:absolute;left:50%;top:42%;width:62px;height:62px;margin:-31px 0 0 -31px;border-radius:50%;background:rgba(0,0,0,.45);border:2px solid rgba(255,255,255,.8);}
.rc.media .mplay::after{content:"";position:absolute;left:24px;top:18px;border-left:20px solid #fff;border-top:13px solid transparent;border-bottom:13px solid transparent;}
.empty{font-size:25px;opacity:.5;align-self:center;}

/* overlays */
.ov{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .3s ease,visibility 0s linear .3s;}
.ov.open{opacity:1;visibility:visible;transition:opacity .3s ease;}
#grid{background:rgba(12,13,15,.97);padding:80px 110px;}
#grid h2,#places h2{font-size:44px;font-weight:600;}
.hint{font-size:23px;opacity:.55;margin:10px 0 36px;}
#grid .gw .rc{opacity:0;transform:scale(.45) rotate(-5deg);transition:opacity .35s ease,transform .7s cubic-bezier(.34,1.56,.64,1),box-shadow .3s;}
#grid .gw .rc.gone{opacity:0;transform:scale(.3) translateY(40px);transition:opacity .3s ease,transform .45s cubic-bezier(.5,0,.75,0);}
#grid h2,#grid .hint{transform:translateY(-24px);opacity:0;transition:opacity .45s ease .1s,transform .6s var(--ease) .1s;}
#grid.open h2{transform:none;opacity:1;}#grid.open .hint{transform:none;opacity:.55;}
#grid .gw .rc.lit{opacity:1;transform:none;}
#grid .gw .rc.lit.focus{transform:scale(1.06);}
#gfx{position:absolute;left:0;top:0;width:1920px;height:1080px;pointer-events:none;}
.lhead{display:flex;align-items:center;gap:60px;margin-bottom:46px;}
#live{background:#0c0d0f;padding:80px 110px;}
#live h2{font-size:44px;font-weight:600;}
.ltabs{display:flex;gap:16px;}
.ltab{font-size:28px;font-weight:600;padding:14px 34px;border-radius:40px;background:rgba(255,255,255,.07);opacity:.75;transition:background .25s,transform .35s var(--ease),opacity .25s;}
.ltab.sel{opacity:1;background:rgba(255,255,255,.16);}
.ltab.focus{background:#fff;color:#111;opacity:1;transform:scale(1.06);}
.lvp{height:760px;overflow:hidden;padding:14px;margin:-14px;}
.lgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:34px 30px;transition:transform .45s var(--ease);}
.lc{height:200px;border-radius:24px;position:relative;overflow:hidden;padding:26px 28px;display:flex;flex-direction:column;justify-content:flex-end;
  border:1.5px solid rgba(255,255,255,.08);transition:transform .4s var(--ease),box-shadow .3s;}
.lc .ln{font-size:40px;font-weight:800;letter-spacing:-.5px;line-height:1;}
.lc .ls{font-size:21px;opacity:.8;margin-top:10px;}
.lc .lv{position:absolute;left:24px;top:22px;font-size:17px;font-weight:700;letter-spacing:1.5px;padding:5px 12px;border-radius:8px;background:rgba(0,0,0,.35);}
.lc .lv::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;background:#ff4d4d;margin-right:8px;vertical-align:1px;}
.lc .lapp{position:absolute;right:24px;top:22px;font-size:17px;opacity:.75;}
.lc.focus{transform:scale(1.06);box-shadow:0 0 0 3px #fff,0 24px 50px rgba(0,0,0,.55);z-index:2;}
.lhint{position:absolute;left:110px;bottom:46px;font-size:22px;opacity:.5;}
.gvp{height:800px;overflow:hidden;padding:14px;margin:-14px;}
.gw{display:grid;grid-template-columns:repeat(6,1fr);gap:38px 30px;transition:transform .45s var(--ease);}
.gw .rc{width:auto;height:auto;aspect-ratio:16/10;}
#places{background:rgba(12,13,15,.97);padding:80px 110px;}
.pl{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;margin-top:36px;}
.pl div{font-size:27px;padding:20px 24px;border-radius:18px;background:rgba(255,255,255,.07);transition:transform .3s var(--ease),background .2s;}
.pl div.focus{background:#fff;color:#111;transform:scale(1.05);}

/* quick panel */
#qp{position:absolute;top:0;right:0;bottom:0;width:600px;background:#18191d;border-left:1.5px solid rgba(255,255,255,.1);
  padding:70px 44px;transform:translate3d(105%,0,0);transition:transform .5s var(--ease);
  box-shadow:-40px 0 80px rgba(0,0,0,.5);}
#qp.open{transform:none;}
#qp h2{font-size:40px;font-weight:600;margin-bottom:30px;}
.qvp{height:860px;overflow:hidden;margin:0 -10px;padding:0 10px;}
#qlist{transition:transform .45s var(--ease);}
.qi{display:flex;align-items:center;gap:22px;padding:18px 22px;border-radius:22px;margin-bottom:10px;transition:background .2s,transform .3s var(--ease);}
.qi .qic{width:62px;height:62px;border-radius:18px;background:rgba(255,255,255,.08);display:grid;place-items:center;flex:0 0 auto;}
.qi .qic svg{width:32px;height:32px;}
.qi b{display:block;font-size:28px;font-weight:600;}
.qi small{display:block;font-size:21px;opacity:.6;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:400px;}
.qi.focus{background:#fff;color:#111;transform:scale(1.03);}
.qi.focus .qic{background:rgba(0,0,0,.08);}
.ver{position:absolute;left:44px;bottom:34px;font-size:19px;opacity:.35;}

#toast{position:absolute;left:50%;bottom:70px;transform:translate3d(-50%,30px,0);background:#fff;color:#111;font-size:27px;font-weight:500;
  padding:22px 38px;border-radius:40px;opacity:0;transition:opacity .3s,transform .4s var(--ease);max-width:1300px;text-align:center;}
#toast.on{opacity:1;transform:translate3d(-50%,0,0);}
#fps{position:absolute;left:20px;top:20px;font:600 24px monospace;background:rgba(0,0,0,.7);padding:8px 14px;border-radius:10px;display:none;}
#night{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity 2s;}
#saver{background:#000;}
#saver .sp{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity 2s;}
#saver .sp.on{opacity:1;}
#saver .sc{position:absolute;right:90px;bottom:80px;text-align:right;text-shadow:0 4px 30px rgba(0,0,0,.6);}
#saver .sc .t{font-size:150px;font-weight:200;line-height:1;}
#saver .sc .d{font-size:34px;opacity:.9;margin-top:10px;}
</style>
</head>
<body>
<div id="stage">
  <div id="bg"></div><div id="shade"></div>
  <canvas id="fx" width="960" height="540"></canvas>
  <div id="blob"><div class="spin"></div></div>
  <div class="clock"><div class="t" id="ct">--:--</div><div class="d" id="cd"></div></div>
  <div class="topr">
    <div class="wx" id="wx"></div>
    <div class="pill f" data-a="content"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>Mitt innehåll</div>
    <div class="pill f" data-a="account"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>Mitt konto</div>
    <div class="icon f" data-a="panel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="17" x2="20" y2="17"/><circle cx="9" cy="7" r="2.5" fill="currentColor"/><circle cx="15" cy="17" r="2.5" fill="currentColor"/></svg></div>
  </div>

  <div class="tiles" id="tiles">
    <div class="tile f" data-a="tv" data-c="#ff5a5a"><div class="sq" style="background:linear-gradient(160deg,#3a3d45,#1f2126)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6" width="19" height="13" rx="2.5"/><path d="M8 2.5l4 3.5 4-3.5"/><circle cx="17.6" cy="9.6" r="1.5" fill="#ff4d4d" stroke="none"/></svg></div><div class="lbl">Live-tv</div></div>
    <div class="tile f" data-a="telia" data-c="#9b6bff"><div class="sq" style="background:linear-gradient(160deg,#5a35a8,#2a1756)"><div class="brand">Telia<small>PLAY</small></div></div><div class="lbl">Telia Play</div></div>
    <div class="tile f" data-a="youtube" data-c="#ff3b4a"><div class="sq" style="background:linear-gradient(160deg,#b0323a,#5a161c)"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="2" y="5" width="20" height="14" rx="4"/><path d="M10 9v6l5-3z" fill="#5a161c"/></svg></div><div class="lbl">YouTube</div></div>
    <div class="tile f" data-a="music" data-c="#1ed760"><div class="sq" style="background:linear-gradient(160deg,#2f5a45,#16271f)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3" fill="currentColor"/><circle cx="18" cy="16" r="3" fill="currentColor"/></svg></div><div class="lbl">Musik</div></div>
    <div class="tile f" data-a="store" data-c="#3ddc84"><div class="sq" style="background:linear-gradient(160deg,#3b4049,#22252b)"><svg viewBox="0 0 24 24"><path d="M4 3l10 9-10 9z" fill="#34a853"/><path d="M4 3l13 7.5-3 1.5z" fill="#4285f4"/><path d="M4 21l13-7.5-3-1.5z" fill="#ea4335"/><path d="M17 10.5l3 1.5-3 1.5-3-1.5z" fill="#fbbc04"/></svg></div><div class="lbl">Play Butik</div></div>
    <div class="tile f" data-a="web" data-c="#3ea6ff"><div class="sq" style="background:linear-gradient(160deg,#245f88,#123047)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg></div><div class="lbl">Webb</div></div>
    <div class="tile f" data-a="apps" data-c="#6f93ff"><div class="sq" style="background:linear-gradient(160deg,#2f56a8,#1a2f61)"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="7.5" cy="7.5" r="3.5"/><circle cx="16.5" cy="7.5" r="3.5"/><circle cx="7.5" cy="16.5" r="3.5"/><circle cx="16.5" cy="16.5" r="3.5"/></svg></div><div class="lbl">Appar</div></div>
  </div>

  <div class="cont">
    <div class="cinfo">
      <div class="kick">FORTSÄTT DÄR DU SLUTADE</div>
      <div class="ctitle" id="ctitle">—</div>
      <div class="cmeta" id="cmeta"></div>
      <div class="play f" id="playbtn" data-a="resume"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 4l14 8-14 8z"/></svg>Öppna</div>
    </div>
    <div class="recent" id="recent"></div>
  </div>

  <div id="night"></div>

  <div id="grid" class="ov"><h2>Alla appar</h2><div class="hint">Tryck ▶❚❚ på fjärren för att fästa eller lossa en app. Fästa appar visas först.</div><div class="gvp"><div class="gw" id="gw"></div></div></div>
  <canvas id="gfx" width="960" height="540"></canvas>
  <div id="live" class="ov"><div class="lhead"><h2>Live-tv</h2><div class="ltabs" id="ltabs"></div></div>
    <div class="lvp"><div class="lgrid" id="lgrid"></div></div><div class="lhint" id="lhint"></div></div>

  <div id="qp">
    <h2>Snabbpanel</h2>
    <div class="qvp"><div id="qlist"></div></div>
    <div class="ver" id="ver"></div>
  </div>

  <div id="saver" class="ov"><div class="sc"><div class="t" id="st"></div><div class="d" id="sd"></div></div></div>
  <div id="toast"></div>
  <div id="fps"></div>
</div>

<script>
"use strict";
const VERSION="19.0";
let saverOn=false,sT=0,iT=0,sCur=null;
const B=window.OceanBridge;
const $=id=>document.getElementById(id);
const NEWAPP=!!(window.OceanBridge&&window.OceanBridge.memory);
const call=(fn,...a)=>{try{if(B&&B[fn])return B[fn](...a);}catch(e){}return null;};
const LS={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v);}catch(e){return d;}},
          set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};

/* ===== apps ===== */
const MOCK=[["Telia Play","se.telia.androidtv.launcher"],["YouTube","com.google.android.youtube.tv"],["SmartTube","org.smarttube.stable"],
 ["Stremio","com.stremio.one"],["SVT Play","se.svt.android.svtplay"],["TV4 Play","se.tv4.tv4playtab"],["Spotify","com.spotify.tv.android"],
 ["Max","com.wbd.stream"],["VLC","org.videolan.vlc"],["TV Bro","com.phlox.tvwebbrowser"],["Google Play Butik","com.android.vending"]]
 .map(([label,pkg])=>({label,pkg}));
const COL={"YouTube":"#ff0033","SmartTube":"#c62828","Stremio":"#5b3fd1","SVT Play":"#1e8c45","TV4 Play":"#e3002b","Spotify":"#1db954",
 "Max":"#002be7","VLC":"#ff8800","TV Bro":"#1a73e8","BrowseHere":"#1565c0","Telia Play":"#6a2bd9","Google Play Butik":"#2d3138"};
let APPS=[];try{const r=call("getApps");if(r)APPS=JSON.parse(r);}catch(e){}
if(!APPS.length)APPS=MOCK;
const byPkg=p=>APPS.find(a=>a.pkg===p);
const find=re=>APPS.find(a=>re.test(a.label)||re.test(a.pkg));

/* recent + favourites */
const getRecent=()=>LS.get("recent",[]);
const getFav=()=>LS.get("fav",[]);
function remember(pkg){let r=getRecent().filter(x=>x.pkg!==pkg);r.unshift({pkg,t:Date.now()});LS.set("recent",r.slice(0,8));}
let leftForApp=false;
function launch(pkg,label){if(!pkg){toast((label||"Appen")+" finns inte på boxen");return;}remember(pkg);leftForApp=true;
  if(call("launch",pkg)===null&&!B)console.log("öppna",pkg);}
function ago(t){const m=Math.round((Date.now()-t)/6e4);if(m<1)return "nyss";if(m<60)return m+" min sedan";
  const h=Math.round(m/60);if(h<24)return h+" tim sedan";const d=Math.round(h/24);return d===1?"igår":d+" dagar sedan";}

function card(a,num){const c=document.createElement("div");c.className="rc f";c.dataset.pkg=a.pkg;
  if(a.banner)c.innerHTML=`<img class="ban" src="data:image/png;base64,${a.banner}">`;
  else if(a.icon){c.style.background="#f2f2f4";c.innerHTML=`<img class="ico" src="data:image/png;base64,${a.icon}"><div class="nm">${a.label}</div>`;}
  else{c.style.background=COL[a.label]||"#2a2c31";c.innerHTML=`<span class="wm">${a.label}</span>`;}
  if(num)c.insertAdjacentHTML("beforeend",`<div class="num">${num}</div>`);
  return c;}

function mediaCard(a,m){const c=document.createElement("div");c.className="rc f media";c.dataset.pkg=a.pkg;
  const src=m.art?"data:image/jpeg;base64,"+m.art:m.artUri;const ic=a.icon?`<img class="mi" src="data:image/png;base64,${a.icon}">`:"";
  c.innerHTML=`<img class="ban" src="${src}"><div class="mshade"></div><div class="mt">${ic}<span>${m.title.replace(/</g,"&lt;")}</span></div><div class="mplay"></div>`;return c;}
function buildRecent(){

function btText(){const r=call("bluetooth");if(r===null)return B?"Öppnar Bluetooth-inställningar":"Visar anslutna hörlurar";
  try{const b=JSON.parse(r);if(!b.perm)return "Behörighet saknas";if(!b.enabled)return "Bluetooth är av";
    const c=b.devices.filter(d=>d.connected);return c.length?c.map(d=>d.name).join(", ")+" ansluten":"Inga hörlurar anslutna";}catch(e){return "";}}
function memText(){const r=call("memory");if(r===null)return B?"Kräver nästa appversion":"Stänger appar i bakgrunden";
  try{const m=JSON.parse(r);return (m.avail/1024).toFixed(1)+" GB ledigt av "+(m.total/1024).toFixed(1)+" GB";}catch(e){return "";}}
function netText(){const r=call("network");if(r===null)return B?"Öppnar inställningar":"Visar anslutning";
  try{const n=JSON.parse(r);return n.type==="none"?"Ingen anslutning":(n.type==="wifi"?"Wi-Fi":"Kabel")+(n.ip?" · "+n.ip:"");}catch(e){return "";}}
function devName(){return call("deviceName")||"TV:n";}
function qItems(){const perf=LS.get("perf",false),fps=LS.get("fps",false),ort=(LS.get("ort",null)||{name:"Stockholm"}).name;
  return [
   ["bt","Hörlurar",btText(),()=>call("action",NEWAPP?"bluetooth":"settings")],
   ["cast","Spegla telefonen",'Casta till "'+devName()+'"',()=>toast('Öppna Smart View eller Casta på telefonen och välj "'+devName()+'"')],
   ["mem","Frigör minne",memText(),freeMem],
   ["net","Nätverk",netText(),()=>call("action",NEWAPP?"wifi":"settings")],
   ["sun","Väderort",ort,openPlaces],
   ["img","Bakgrund",(BGMODES.find(x=>x[0]===LS.get("bgmode","mix"))||BGMODES[0])[1]+" · tryck OK för att byta",()=>{
      const i=BGMODES.findIndex(x=>x[0]===LS.get("bgmode","mix"));const n=BGMODES[(i+1)%3];LS.set("bgmode",n[0]);newBackdrop();toast("Bakgrund: "+n[1]);fillPanel();}],
   ["spark","Prestandaläge",perf?"På · partiklar och spegling av":"Av · partiklar visas",()=>{LS.set("perf",!perf);applyPerf();fillPanel();}],
   ["fps","FPS-mätare",(fps?"På":"Av")+" · boxen mätte "+LS.get("measuredFps","?")+" FPS",()=>{toggleFps();fillPanel();}],
   ["set","Inställningar","Boxens inställningar",()=>call("action","settings")]];}
let QI=[];
function fillPanel(){QI=qItems();$("qlist").innerHTML=QI.map(([ic,t,s])=>
  `<div class="qi"><div class="qic"><svg viewBox="0 0 24 24">${IC[ic]}</svg></div><div><b>${t}</b><small>${s}</small></div></div>`).join("");
  $("ver").textContent="Version "+VERSION;render();}
function openPanel(){qi=0;zone="panel";$("qlist").style.transform="";fillPanel();$("qp").classList.add("open");}
function closePanel(){$("qp").classList.remove("open");zone="main";render();}
function panelKey(k){if(k==="down")qi=Math.min(QI.length-1,qi+1);else if(k==="up")qi=Math.max(0,qi-1);
  else if(k==="ok"){QI[qi][3]();return;}else if(k==="back"||k==="left")return closePanel();render();}
function freeMem(){const r=call("freeMemory");if(r===null){toast("Kräver nästa appversion (byggs på datorn)");return;}
  try{const m=JSON.parse(r);const d=Math.max(0,Math.round(m.after-m.before));toast("Frigjorde "+d+" MB · "+(m.after/1024).toFixed(1)+" GB ledigt");}catch(e){}fillPanel();}

/* ===== weather place picker ===== */
const PLACES=[["Stockholm",59.33,18.07],["Göteborg",57.71,11.97],["Malmö",55.6,13],["Uppsala",59.86,17.64],["Västerås",59.61,16.55],
 ["Örebro",59.27,15.21],["Linköping",58.41,15.62],["Norrköping",58.59,16.19],["Helsingborg",56.05,12.69],["Jönköping",57.78,14.16],
 ["Lund",55.7,13.19],["Umeå",63.83,20.26],["Gävle",60.67,17.14],["Borås",57.72,12.94],["Södertälje",59.2,17.63],["Eskilstuna",59.37,16.51],
 ["Halmstad",56.67,12.86],["Växjö",56.88,14.81],["Karlstad",59.38,13.5],["Sundsvall",62.39,17.31],["Luleå",65.58,22.15],
 ["Östersund",63.18,14.64],["Kalmar",56.66,16.36],["Kristianstad",56.03,14.16],["Falun",60.61,15.63]];
function openPlaces(){$("pl").innerHTML=PLACES.map(p=>`<div>${p[0]}</div>`).join("");const cur=(LS.get("ort",null)||{}).name;
  pi=Math.max(0,PLACES.findIndex(p=>p[0]===cur));zone="places";$("places").classList.add("open");render();}
function placeKey(k){const N=PLACES.length;
  if(k==="right")pi=Math.min(N-1,pi+1);else if(k==="left")pi=Math.max(0,pi-1);
  else if(k==="down")pi=Math.min(N-1,pi+5);else if(k==="up")pi=Math.max(0,pi-5);
  else if(k==="ok"){const[n,la,lo]=PLACES[pi];LS.set("ort",{name:n,lat:la,lon:lo});weather();toast("Vädret visar nu "+n);}
  if(k==="ok"||k==="back"){$("places").classList.remove("open");zone="panel";fillPanel();return;}
  render();}

/* ===== toast ===== */
let tT=0;function toast(m){const t=$("toast");t.textContent=m;t.classList.add("on");clearTimeout(tT);tT=setTimeout(()=>t.classList.remove("on"),3200);}

/* ===== particles: half-res canvas, prerendered sprites, 30 fps, paused when hidden ===== */
const fx=$("fx"),g=fx.getContext("2d");
function sprite(rgb){const s=document.createElement("canvas");s.width=s.height=32;const c=s.getContext("2d");
  const gr=c.createRadialGradient(16,16,0,16,16,16);gr.addColorStop(0,`rgba(${rgb},1)`);gr.addColorStop(.35,`rgba(${rgb},.35)`);gr.addColorStop(1,`rgba(${rgb},0)`);
  c.fillStyle=gr;c.fillRect(0,0,32,32);return s;}
const SPR=[sprite("255,255,255"),sprite("170,200,255"),sprite("200,170,255")];
const P=[];for(let i=0;i<60;i++)P.push(newP(true));
function newP(any){return{x:Math.random()*960,y:any?Math.random()*540:550,s:4+Math.random()*12,v:.08+Math.random()*.3,
  w:Math.random()*6.28,ws:.004+Math.random()*.01,a:.15+Math.random()*.45,k:SPR[Math.floor(Math.random()*3)]};}
let fxOn=true,lastF=0;
function fxLoop(t){requestAnimationFrame(fxLoop);if(!fxOn||document.hidden||saverOn)return;if(t-lastF<33)return;lastF=t;
  g.clearRect(0,0,960,540);
  for(const p of P){p.y-=p.v;p.w+=p.ws;const x=p.x+Math.sin(p.w)*18;if(p.y<-20)Object.assign(p,newP(false));
    g.globalAlpha=p.a*(0.6+0.4*Math.sin(p.w*2));g.drawImage(p.k,x-p.s/2,p.y-p.s/2,p.s,p.s);}
  g.globalAlpha=1;}
requestAnimationFrame(fxLoop);
function applyPerf(){const on=LS.get("perf",false);fxOn=!on;document.body.classList.toggle("perf",on);if(on)g.clearRect(0,0,960,540);}

/* ===== FPS meter ===== */
let fpsOn=false,fc=0,fl=0;
function toggleFps(){fpsOn=!LS.get("fps",false);LS.set("fps",fpsOn);$("fps").style.display=fpsOn?"block":"none";
  toast("FPS-mätare "+(fpsOn?"på":"av"));}
function fpsLoop(t){requestAnimationFrame(fpsLoop);if(!fpsOn)return;fc++;if(t-fl>=1000){$("fps").textContent="FPS "+fc;fc=0;fl=t;}}
requestAnimationFrame(fpsLoop);

/* ===== clock, weather, night dim ===== */
const DAG=["söndag","måndag","tisdag","onsdag","torsdag","fredag","lördag"],MAN=["januari","februari","mars","april","maj","juni","juli","augusti","september","oktober","november","december"];
function dateTxt(d){const x=DAG[d.getDay()];return x[0].toUpperCase()+x.slice(1)+" "+d.getDate()+" "+MAN[d.getMonth()];}
function hhmm(d){return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");}
function tick(){const d=new Date();$("ct").textContent=hhmm(d);$("cd").textContent=dateTxt(d);
  const h=d.getHours();$("night").style.opacity=(h>=22||h<6)?.22:0;if(saverOn){$("st").textContent=hhmm(d);$("sd").textContent=dateTxt(d);}}
setInterval(tick,15000);tick();
const WI={0:"☀️",1:"🌤️",2:"⛅",3:"☁️",45:"🌫️",48:"🌫️",51:"🌦️",53:"🌦️",55:"🌧️",61:"🌦️",63:"🌧️",65:"🌧️",71:"🌨️",73:"🌨️",75:"❄️",80:"🌦️",81:"🌧️",82:"🌧️",95:"⛈️"};
async function weather(){try{const o=LS.get("ort",null)||{lat:59.33,lon:18.07};
  const d=await(await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${o.lat}&longitude=${o.lon}&current=temperature_2m,weather_code&timezone=auto`)).json();
  $("wx").textContent=(WI[d.current.weather_code]||"🌡️")+" "+Math.round(d.current.temperature_2m)+"°";}catch(e){}}
weather();setInterval(weather,18e5);

/* ===== backgrounds: free nature photos and soft gradients ===== */
const GRADS=[
 "radial-gradient(70% 80% at 15% 15%,#6a3df0 0%,transparent 60%),radial-gradient(60% 70% at 90% 85%,#ff5f8f 0%,transparent 60%),#14102b",
 "radial-gradient(70% 80% at 80% 10%,#00b3a4 0%,transparent 60%),radial-gradient(70% 70% at 10% 90%,#1f4fd6 0%,transparent 60%),#07151f",
 "radial-gradient(80% 80% at 20% 80%,#ff8a3d 0%,transparent 55%),radial-gradient(70% 70% at 85% 20%,#c2185b 0%,transparent 60%),#1c0b12",
 "radial-gradient(70% 70% at 50% 0%,#3a7bd5 0%,transparent 60%),radial-gradient(60% 60% at 50% 100%,#00d2ff 0%,transparent 55%),#061226",
 "radial-gradient(70% 80% at 10% 20%,#2ecc71 0%,transparent 55%),radial-gradient(70% 70% at 90% 80%,#0f766e 0%,transparent 60%),#06140f",
 "radial-gradient(70% 70% at 85% 15%,#f7b733 0%,transparent 55%),radial-gradient(70% 70% at 15% 85%,#fc4a1a 0%,transparent 60%),#1d0d06",
 "radial-gradient(80% 80% at 30% 30%,#8e2de2 0%,transparent 55%),radial-gradient(70% 70% at 80% 75%,#4a00e0 0%,transparent 60%),#0d0620",
 "radial-gradient(70% 80% at 20% 15%,#ee9ca7 0%,transparent 55%),radial-gradient(70% 70% at 85% 85%,#6d5bd0 0%,transparent 60%),#1a1424",
 "radial-gradient(70% 70% at 75% 25%,#43cea2 0%,transparent 55%),radial-gradient(70% 70% at 20% 80%,#185a9d 0%,transparent 60%),#06131c",
 "radial-gradient(80% 70% at 50% 110%,#ff512f 0%,transparent 55%),radial-gradient(60% 60% at 50% -10%,#24243e 0%,transparent 60%),#0f0c29"];
const BGPH=[1015,1016,1018,1022,1036,1039,1043,1044,1050,10,11,13,14,15,16,17,28,29];
const BGMODES=[["mix","Blandat"],["photo","Naturfoton"],["grad","Gradienter"]];
let bgCur=null,bgLast="";
function showBg(css){const d=document.createElement("div");d.className="bgl";d.style.background=css;
  d.style.backgroundSize="cover";d.style.backgroundPosition="center";$("bg").appendChild(d);
  requestAnimationFrame(()=>requestAnimationFrame(()=>d.classList.add("on")));
  const o=bgCur;bgCur=d;if(o){o.classList.remove("on");setTimeout(()=>o.remove(),1300);}}
function pick(a){let x;do{x=a[Math.floor(Math.random()*a.length)];}while(String(x)===bgLast&&a.length>1);bgLast=String(x);return x;}
function newBackdrop(){const m=LS.get("bgmode","mix");const grad=m==="grad"||(m==="mix"&&Math.random()<.5);
  if(grad)return showBg(pick(GRADS));
  const id=pick(BGPH),img=new Image();img.onload=()=>showBg(`url("${img.src}")`);img.onerror=()=>showBg(pick(GRADS));
  img.src=`https://picsum.photos/id/${id}/1920/1080`;}

/* ===== screensaver after 10 min ===== */
const PH=[1015,1016,1018,1022,1036,1039,1043,1044,1050,10,11,13,14,15,16,17,28,29];

function sPhoto(){const img=new Image();img.onload=()=>{if(!saverOn)return;const d=document.createElement("div");d.className="sp";
  d.style.backgroundImage=`url("${img.src}")`;$("saver").prepend(d);requestAnimationFrame(()=>requestAnimationFrame(()=>d.classList.add("on")));
  const o=sCur;sCur=d;if(o){o.classList.remove("on");setTimeout(()=>o.remove(),2100);}};
  img.src=`https://picsum.photos/id/${PH[Math.floor(Math.random()*PH.length)]}/1920/1080`;}
function startSaver(){if(saverOn)return;saverOn=true;tick();sPhoto();$("saver").classList.add("open");sT=setInterval(sPhoto,20000);}
function stopSaver(){saverOn=false;clearInterval(sT);$("saver").classList.remove("open");setTimeout(()=>{$("saver").querySelectorAll(".sp").forEach(e=>e.remove());sCur=null;},400);}
function bumpIdle(){clearTimeout(iT);iT=setTimeout(startSaver,6e5);}bumpIdle();

/* ===== self-update from GitHub (only when started through the loader) ===== */
const SRC="https://raw.githubusercontent.com/cruzin4bruzinrl-code/enkelhem/main/tv/index.html";
function checkUpdate(){let cur=null;try{cur=localStorage.getItem("hemPage");}catch(e){}if(cur===null)return;
  fetch(SRC+"?t="+Date.now(),{cache:"no-store"}).then(r=>r.ok?r.text():null).then(t=>{
    if(!t||t.indexOf("<html")<0||t===cur)return;try{localStorage.setItem("hemPage",t);}catch(e){}location.reload();}).catch(()=>{});}
setInterval(checkUpdate,15*60*1000);setTimeout(checkUpdate,20000);

/* ===== wiring ===== */
window.oceanKey=key;
/* called by the app whenever the window regains focus (also after volume popups etc.):
   only refresh when we actually came back from another app, and never move the highlight */
window.oceanShown=function(){checkUpdate();tick();if(!leftForApp)return;leftForApp=false;if(zone==="live"){render();return;}
  if(saverOn)stopSaver();if(zone!=="main"){["grid","places"].forEach(i=>$(i).classList.remove("open"));$("qp").classList.remove("open");zone="main";}
  buildRecent();render();bumpIdle();newBackdrop();};
addEventListener("keydown",e=>{const m={ArrowRight:"right",ArrowLeft:"left",ArrowUp:"up",ArrowDown:"down",Enter:"ok",Escape:"back",Backspace:"back",h:"hold",
   MediaPlayPause:"playkey",MediaPlay:"playkey",MediaPause:"playkey",p:"playkey",MediaRecord:"rec",ColorF0Red:"rec",r:"rec",
   MediaLast:"last",l:"last",AllApps:"allapps",a:"allapps"};
  let k=m[e.key];if(!k&&/^\d$/.test(e.key))k="n"+e.key;
  if(k){key(k);e.preventDefault();return;}
  if(!["Shift","Control","Alt","Meta","AudioVolumeUp","AudioVolumeDown","AudioVolumeMute"].includes(e.key))toast("Knapp: "+e.key+" ("+e.keyCode+")");});
function fit(){const s=Math.min(innerWidth/1920,innerHeight/1080),st=$("stage");st.style.transformOrigin="0 0";
  st.style.transform=`scale(${s})`;st.style.left=((innerWidth-1920*s)/2)+"px";st.style.top=((innerHeight-1080*s)/2)+"px";}
function noScroll(){[document.scrollingElement,document.body,$("stage")].forEach(e=>{if(e){e.scrollTop=0;e.scrollLeft=0;}});}
addEventListener("scroll",noScroll,true);
addEventListener("resize",fit);fit();
if(LS.get("fps",false)){fpsOn=true;$("fps").style.display="block";}
applyPerf();buildRecent();newBackdrop();render();
/* measure the box: if it renders slowly, keep the liquid motion but drop the spinning ring */
(function(){let n=0,t0=0;function m(t){if(!t0)t0=t;n++;if(t-t0<2000)return requestAnimationFrame(m);
  const fps=n*1000/(t-t0);if(fps<40)document.body.classList.add("lite");LS.set("measuredFps",Math.round(fps));}
  setTimeout(()=>requestAnimationFrame(m),1500);})();
</script>
